<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF7EF">
<meta name="description" content="把新习惯挂在每天雷打不动的那件事后面。只做记录，不做考核。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="汉堡包计划">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>汉堡包计划</title>
<style>
/* ============================================================================
   字体：三套，全部自托管（绝不挂 Google Fonts / CDN —— 连不上会静默掉字形）
   标题 站酷快乐体 / 正文 资源圆体 / 数字与时间 Baloo 2
   ==========================================================================*/
@font-face{font-family:"Resource Han Rounded";src:url("fonts/ResourceHanRoundedCN-subset.woff2") format("woff2");font-weight:200 900;font-style:normal;font-display:swap}
@font-face{font-family:"ZCOOL KuaiLe";src:url("fonts/ZCOOLKuaiLe-subset.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Baloo 2";src:url("fonts/Baloo2-Medium-subset.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Baloo 2";src:url("fonts/Baloo2-SemiBold-subset.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Baloo 2";src:url("fonts/Baloo2-Bold-subset.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-user-drag:none}
/* 只有真正要打字的地方恢复「可选、可长按」：新增页的输入框、手账的写作区。
   其余整站不可选中 —— 否则按住事项卡片一拖动就变成"选中了卡片上的文字"，
   iOS 还会顺手弹出「拷贝 / 查询」菜单，把拖动整个打断。 */
input,textarea,select,[contenteditable]{
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
:root{
  --bg:#FFF7EF;--card:#FFFFFF;--line:#F7E9D9;--main:#FFB27A;--deep:#E8945C;
  --light:#FFF1E4;--done:#9CCB9E;--text:#4A3F35;--sub:#A79383;--faint:#C0AC99;
  --anchor:#A8784F;--dash:#F2DEC8;--un:#FDF3E7;
  --ft:"ZCOOL KuaiLe","Resource Han Rounded",sans-serif;
  --fb:"Resource Han Rounded","PingFang SC","Microsoft YaHei",sans-serif;
  --fn:"Baloo 2","Resource Han Rounded",sans-serif;
}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{background:#EFE4D6;font-family:var(--fb);color:var(--text);
  display:flex;justify-content:center;align-items:flex-start;font-size:15px}

/* ---------- 手机容器 ----------
   真机上永远是「应用本身」：铺满整屏，没有外框、没有假状态栏。
   只有「桌面上用鼠标看」时才套一个手机壳当预览框。
   判断依据是「有没有鼠标」而不是窗口宽度 —— 手机横屏 / iPad / 开了
   「请求桌面网站」时窗口都很宽，但它们都是真机，绝不能套壳。 */
.phone{width:100%;background:var(--bg);display:flex;flex-direction:column;
  position:relative;height:100vh;height:100dvh;overflow:hidden;
  padding-top:env(safe-area-inset-top)}
/* 假状态栏：真机交给系统自己画，这里只在桌面预览时补一个 */
.sb{height:58px;flex:0 0 58px;display:none;align-items:center;justify-content:space-between;
  padding:0 24px;font-family:var(--fn);font-weight:600;font-size:15px;color:var(--text)}
.sb-icons{display:flex;align-items:center;gap:5px}
@media (min-width:560px) and (hover:hover) and (pointer:fine){
  body{padding:26px 16px}
  .phone{max-width:432px;height:min(880px,calc(100dvh - 52px));border-radius:40px;overflow:hidden;
    box-shadow:0 26px 60px rgba(140,105,70,.28),0 0 0 9px #2B241E}
  .sb{display:flex}
}

.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:6px 20px 12px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.body::-webkit-scrollbar{width:0}
.body.subpage{padding-bottom:26px}
.body.locked{overflow:hidden}

/* ---------- 今天页头 ---------- */
.hdr{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.hdr-date{display:flex;align-items:center;justify-content:space-between;font-size:12px;
  color:#C9AC92;font-weight:500;min-height:24px}
.more{display:flex;align-items:center;cursor:pointer;padding:4px 0 4px 8px;border-radius:8px}
.more:active{background:#F6EADA}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.hdr-title{font-family:var(--ft);font-size:34px;line-height:1.1;display:flex;align-items:center;gap:7px}
.spark{display:inline-flex;vertical-align:middle}
.hdr-sub{font-size:12px;color:#A79383;margin-top:5px}
.mascot{width:56px;height:56px;flex:0 0 56px}

/* ---------- 锚点行 ---------- */
.timeline{display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
.anchor-row{display:flex;align-items:center;gap:8px;padding:8px 0 2px;border-radius:10px}
.anchor-row .a-name{font-size:13px;font-weight:700;color:var(--anchor)}
.anchor-row .a-time{font-family:var(--fn);font-size:12px;font-weight:600;color:var(--deep);margin-left:-3px}
.anchor-row .a-dash{flex:1;border-top:2px dashed var(--dash);margin-left:6px}
/* 锚点降级：今天没有事项安排在这儿的锚点，压成一行小字 */
.anchor-mini{display:flex;align-items:center;gap:6px;padding:2px 0 2px 21px}
.anchor-mini .am-name{font-size:11.5px;font-weight:500;color:var(--faint)}
.anchor-mini .am-time{font-family:var(--fn);font-size:11px;font-weight:600;color:#D2BFA6}

/* ---------- 事项卡片 ---------- */
.task{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);
  border:1.5px solid var(--line);border-radius:24px;box-shadow:0 3px 14px rgba(217,168,125,.16);
  cursor:grab;touch-action:pan-y;transition:box-shadow .18s,transform .18s,border-color .18s;
  position:relative}
.task.done{background:#FBFDFA}
/* 打勾 / 取消：不做淡出。重绘后让卡片**从原来的位置直接滑到新位置**（FLIP），
   全程看得见它去哪了。位置由 JS 算出来的 inline transform 驱动。 */
.task.flipping,.anchor-row.flipping,.anchor-mini.flipping{position:relative;z-index:5}
/* 滑动途中抬一点阴影，看起来是"卡片被移到下面去了"，不是穿过别的卡片 */
.task.flipping{box-shadow:0 14px 28px rgba(217,158,115,.26)}
.ico{width:42px;height:42px;flex:0 0 42px;border-radius:21px;display:flex;align-items:center;justify-content:center}
.ico svg{width:42px;height:42px;display:block}
.tt{flex:1;min-width:0}
.t1{font-size:17px;font-weight:700;line-height:1.35;word-break:break-word}
.task.done .t1{color:var(--sub)}
.t2{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.35;word-break:break-word}
.chk{width:25px;height:25px;flex:0 0 25px;border-radius:50%;border:2px dashed #F0DCC8;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.18s;
  position:relative}
/* 打勾的热区比圈大：卡片右侧一小条、**整张卡片的高**都算打勾，
   不用精准戳中那个圈。25px 的圈是视觉规格，尺寸一点都不变。

   横向宽度 = 卡片宽的 18%（约五分之一再小一点），封顶 68px ——
   宽屏幕上不封顶的话它会横着长到盖住半个标题。下限由圈决定：
   圈 + 右内边距 = 41px，所以再窄也不能低于 ~46px，否则点圈左半边会掉进编辑页。

   为什么是真实元素 .hit 而不是 .chk 的伪元素：伪元素的 top/bottom 只能写死 px，
   卡片一旦被长标题撑高（72px → 98px），上下边缘就漏在热区外。
   .hit 用 top:0;bottom:0 贴着卡片走，卡片多高它就多高。

   点在这儿拿到的事件目标带 data-act="check"，跟圈上的 attrs 完全一样，
   所以点击 / 长按菜单 / 拖动排除三处只需要多认一个选择器（.chk, .hit）。 */
.task .hit{position:absolute;top:0;bottom:0;right:0;width:min(18%, 68px);z-index:1;cursor:pointer;
  border-radius:0 24px 24px 0;-webkit-touch-callout:none}
.chk.on{background:var(--done);border:2px solid var(--done)}
.chk.on:after{content:"";width:11px;height:6px;border-left:2.2px solid #fff;border-bottom:2.2px solid #fff;
  transform:rotate(-45deg) translate(1px,-2px)}
/* 计数型：圈里换成进度弧，位置和尺寸都不动，用户不用学新东西 */
.chk.ring{border:none;background:transparent;position:relative;padding:0;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.chk.ring svg{display:block}
.chk.ring .cnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--fn);font-size:10.5px;font-weight:700;color:var(--main);line-height:1}
/* 长按圈弹出来的小菜单（减一 / 今天就这样） */
.chkmenu{position:fixed;z-index:70;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;box-shadow:0 10px 26px rgba(180,140,100,.22);padding:6px;min-width:132px;
  animation:cmIn .16s ease}
@keyframes cmIn{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
.chkmenu .mi{padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:700;
  color:var(--text);white-space:nowrap}
.chkmenu .mi:active{background:var(--light)}
.chkmenu .mi.off{color:#C9B49C}
.task.dragging{position:fixed;z-index:60;margin:0;cursor:grabbing;opacity:.94;pointer-events:none;
  border-color:var(--main);box-shadow:0 10px 22px rgba(217,158,115,.30)}
/* 按住够了、卡片"拿起来了"：只给一点点抬起感和描边，告诉她现在能拖了 */
.task.arming{transform:scale(1.035);border-color:var(--main);
  box-shadow:0 8px 20px rgba(217,168,125,.26)}

/* ---------- 拖动落点槽 ---------- */
.slot{max-height:0;min-height:0;overflow:hidden;border-radius:18px;margin:0;padding:0;position:relative;
  transition:max-height .18s ease,min-height .18s ease,margin .18s ease}
/* 槽要画在拖动中的卡片之上，否则手指会把落点整个盖住 */
.slot.near,.slot.un-slot{
  max-height:58px;min-height:52px;margin:2px 0 4px;padding:0 12px;z-index:65;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;
  font-size:12.5px;font-weight:700}
.slot.near{background:var(--light);box-shadow:inset 0 0 0 2px var(--main);color:var(--deep)}
/* 「未分配」的槽在拖动时常显 —— 它提示的是"拖到底就是取消安排" */
.slot.un-slot{background:var(--light);box-shadow:inset 0 0 0 2px #F3DCBE;color:#CBA983}
.slot.un-slot.near{box-shadow:inset 0 0 0 2px var(--main);color:var(--deep)}
.dragfoot{display:none;align-items:center;justify-content:space-between;padding:2px 2px 0;flex:0 0 auto}
.dragfoot.on{display:flex}
.dragfoot span{font-size:11.5px;color:var(--faint);font-weight:500}
.dragfoot .l{color:var(--deep);font-weight:700}

/* ---------- 未分配 ---------- */
.unassigned{background:var(--un);border:1.5px dashed var(--dash);border-radius:20px;
  padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px;transition:.15s}
.un-head{display:flex;align-items:center;gap:8px;padding:2px 4px;border-radius:10px}
.un-title{font-size:13px;font-weight:700;color:#B79A7C}
.un-assigned .task,.unassigned .task{box-shadow:0 2px 10px rgba(217,168,125,.13)}
.slot.un-slot.near{margin:2px 0 4px}
/* ---------- 习惯栏（计数型）----------
   一天要做 N 次的不是"一件事"，是"一个过程"：它不会因为你喝到第 3 杯就完成，
   所以它不进「已完成」区、也不参与拖动排序 —— 到量只是变绿，还在原位，明天归零。 */
.habitsec{background:rgba(255,255,255,.72);border:1.5px solid var(--line);border-radius:20px;
  padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px;
  box-shadow:0 3px 14px rgba(217,168,125,.10)}
.habit-head{display:flex;align-items:center;gap:7px;padding:2px 4px}
.hs-title{font-size:12.5px;font-weight:700;color:var(--deep)}
.hs-num{font-family:var(--fn);font-size:11.5px;font-weight:600;color:#C4AF9A;
  background:#F8EEE4;border-radius:9px;padding:1px 7px;line-height:1.5;margin-left:auto}
.habitsec .task{box-shadow:0 2px 10px rgba(217,168,125,.13);cursor:pointer}
/* 到量了也不挪窝：只是勾上、颜色淡一档，想再加一次再点一下就是 */
.habitsec .task.done{background:#FBFDFA}

/* 已完成：全都收在这一块，颜色淡一档，不跟"今天还要做"的抢注意力 */
.donesec{margin-top:4px;background:rgba(255,255,255,.6);border:1.5px dashed #F0E3D6;
  border-radius:20px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px}
.done-head{display:flex;align-items:center;gap:7px;padding:2px 4px}
.done-title{font-size:12.5px;font-weight:700;color:#BCA68E}
.done-num{font-family:var(--fn);font-size:11.5px;font-weight:600;color:#C4AF9A;
  background:#F8EEE4;border-radius:9px;padding:1px 7px;line-height:1.5}
.donesec .task{box-shadow:0 2px 9px rgba(217,168,125,.09)}

.spacer{flex:1 1 auto;min-height:18px}

/* ---------- 手账入口 / 新增入口 ---------- */
.note-entry{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;
  border:1.5px solid var(--line);border-radius:20px;cursor:pointer;flex:0 0 auto;
  box-shadow:0 3px 14px rgba(217,168,125,.13)}
.note-entry:active{background:#FFFAF3}
.note-entry span{font-size:13px;font-weight:500;color:var(--sub)}
.add-row{display:flex;align-items:center;gap:7px;cursor:pointer;padding:8px 4px;flex:0 0 auto}
.add-row span{font-size:12.5px;font-weight:500;color:var(--deep)}
.plus{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--main);display:flex;
  align-items:center;justify-content:center;font-size:13px;color:var(--deep);line-height:1}

/* ---------- Tab Bar ---------- */
.tabbar{padding:10px 20px 22px;flex:0 0 auto}
.tabbar{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.tabpill{display:flex;background:#fff;border-radius:22px;padding:5px;box-shadow:0 6px 20px rgba(200,155,110,.18)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;
  border-radius:25px;cursor:pointer;transition:.15s}
.tab.on{background:var(--main)}
.tab span{font-size:10px;font-weight:500;color:#C0AE9C}
.tab.on span{color:#fff;font-weight:700}
.tab .ti{width:19px;height:19px;display:flex;align-items:center;justify-content:center}
.tab .ti svg *{stroke:#C0AC99;fill:none}

/* ---------- iOS「添加到主屏幕」引导条 ----------
   只在 iPhone 浏览器里冒出来；加到主屏幕后 display-mode 变成 standalone，
   它自己就不出现了。贴底整条，不做成浮在中间的卡片（那样会压住别人的卡）。 */
.ios-tip{position:fixed;left:0;right:0;bottom:0;z-index:80;
  max-width:432px;margin:0 auto;
  display:flex;align-items:flex-start;gap:9px;
  padding:15px 18px calc(18px + env(safe-area-inset-bottom));
  background:#fff;border-top:1.5px solid #FFE0C4;border-radius:22px 22px 0 0;
  box-shadow:0 -10px 30px rgba(200,150,105,.22);
  animation:tipIn .32s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes tipIn{
  from{opacity:0;transform:translateY(100%)}
  to  {opacity:1;transform:translateY(0)}}
.ios-tip-txt{flex:1;font-size:12.5px;line-height:1.75;color:#7A6552}
.ios-tip-txt b{color:var(--deep);font-weight:700}
.ios-tip-x{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#F7EFE5;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.tab.on .ti svg *{stroke:#fff}

/* ---------- 子页通用 ---------- */
.sub-nav{display:flex;align-items:center;gap:10px;cursor:pointer;padding:2px 0;flex:0 0 auto;min-height:24px}
/* 返回热区：箭头本身只有 13px 高，手指很难点准。
   用伪元素往四周扩一圈（左边一直扩到屏幕边），不改布局、不影响别的元素。 */
.sub-nav[data-act="back"]{position:relative;z-index:3}
.sub-nav[data-act="back"]::after{content:"";position:absolute;left:-22px;top:-12px;
  width:100px;bottom:-12px}
.sub-nav[data-act="back"]:active{opacity:.55}
/* 只有汉堡页用：日期在左、新增在右 */
.subnav-bar{justify-content:space-between;cursor:default}
.addbtn{width:31px;height:31px;flex:0 0 31px;border-radius:50%;background:#fff;
  border:1.5px solid var(--line);color:var(--main);font-size:19px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 2px 8px rgba(217,158,115,.16);transition:transform .15s,background .15s}
.addbtn:active{transform:scale(.92);background:var(--light)}
.sub-date{font-size:12px;font-weight:500;color:#C9AC92}
.sub-title{font-family:var(--ft);font-size:30px;line-height:1.2;flex:0 0 auto}
.sub-sub{font-size:12px;color:#A79383;margin-top:-6px}

/* ---------- 表单 ---------- */
.form{display:flex;flex-direction:column;gap:14px;background:#fff;border:1.5px solid var(--line);
  border-radius:28px;padding:18px;flex:0 0 auto;box-shadow:0 3px 14px rgba(217,168,125,.13);
  position:relative}
.sheet-grip{width:40px;height:4px;border-radius:2px;background:#F2E4D3;margin:-6px auto 2px}
.fld{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:12.5px;font-weight:700;color:var(--sub)}
.finput{width:100%;border:none;border-radius:14px;padding:11px 14px;background:var(--bg);
  font-family:var(--fb);font-size:16px;font-weight:700;color:var(--text);outline:none}
.finput::placeholder{color:#D8C9B6;font-weight:500}
.finput:focus{box-shadow:inset 0 0 0 1.5px var(--main)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ftxt{font-size:14px;font-weight:700;color:var(--text)}
.fdesc{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.4}
.switch{width:46px;height:28px;flex:0 0 46px;border-radius:14px;background:#F2DEC8;padding:3px;
  display:flex;align-items:flex-start;cursor:pointer;transition:.18s}
.switch i{width:22px;height:22px;border-radius:50%;background:#fff;display:block;transition:.18s;
  box-shadow:0 1px 3px rgba(150,110,70,.25)}
.switch.on{background:var(--main);align-items:flex-end}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;cursor:pointer;transition:.15s;background:#F7EEE3;color:#C0AC99}
.dot.on{background:var(--main);color:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:#F7EEE3;color:#B79A7C;font-size:12.5px;
  font-weight:700;cursor:pointer;transition:.15s}
.chip.on{background:var(--light);color:var(--deep);box-shadow:inset 0 0 0 1.5px var(--main)}
/* ---------- 图标选择行 ----------
   42px 和卡片左边的图标同尺寸 —— 选的什么样，放上去就什么样。
   横滑就是展开，不做「展开更多」按钮，所以得让「还能滑」看得见：
   间距 12px 是算过的 —— 393 宽的屏上正好放下 5 个、第 6 个露六成，
   右边再叠一道渐隐兜底（更宽的屏上第 7 个只露一条边时也还有提示）。
   滑到底渐隐收掉（.at-end），免得到头了还虚着、看着像没渲完。 */
.picker{display:flex;gap:12px;overflow-x:auto;padding:4px 6px 4px 5px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 14px),transparent);
          mask-image:linear-gradient(to right,#000 calc(100% - 14px),transparent)}
.picker::-webkit-scrollbar{display:none}
.picker.at-end{-webkit-mask-image:none;mask-image:none}
.pick{flex:0 0 42px;width:42px;height:42px;border-radius:21px;cursor:pointer;
  transition:box-shadow .16s ease}
.pick svg{width:42px;height:42px;display:block;pointer-events:none}
/* 内圈 2px 用白色 = .form 的底色，画出一道间隔；
   用 box-shadow 而不是 border，是为了不占布局 —— 否则选中时整行会跳一下。 */
.pick.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--main)}

/* 时间：小时框 : 分钟框 —— 冒号是固定画出来的，不靠输入（手机键盘上没有冒号） */
.time-row{display:flex;align-items:center;gap:6px}
.time-row .to{font-size:12px;color:var(--faint);flex:0 0 auto;margin:0 2px}
.tgroup{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:3px;min-width:0}
.time-row .finput{width:46px;flex:0 0 46px;text-align:center;font-family:var(--fn);
  font-weight:600;font-size:16px;padding:11px 2px;letter-spacing:.02em}
.time-row .finput::placeholder{font-weight:500}
.tcolon{font-family:var(--fn);font-size:17px;font-weight:700;color:#C0A992;flex:0 0 auto;
  margin-top:-1px}
.hint{font-size:11.5px;color:var(--faint);line-height:1.6}
.hint.bad{color:#C9736A}
.hint b{font-family:var(--fn);font-weight:700;color:#B0855F}
.preview{background:var(--light);border-radius:14px;padding:12px 14px;font-size:12.5px;
  color:#B0855F;font-weight:700;line-height:1.5;word-break:break-word}
.btn{height:50px;border-radius:25px;background:var(--main);color:#fff;font-family:var(--fb);
  font-size:15px;font-weight:700;border:none;cursor:pointer;flex:0 0 auto;
  box-shadow:0 6px 16px rgba(255,178,122,.4)}
.btn:active{background:var(--deep)}
.btn.ghost{background:#fff;color:var(--deep);box-shadow:none;border:1.5px solid var(--line)}
.foot-note{display:flex;align-items:center;justify-content:space-between;padding:0 4px;flex:0 0 auto}
.foot-note span{font-size:11.5px;color:var(--faint)}
.danger{display:flex;align-items:center;justify-content:center;padding:14px;background:#fff;
  border:1.5px solid var(--line);border-radius:16px;cursor:pointer;flex:0 0 auto}
.danger span{font-size:12.5px;font-weight:700;color:#C4A88F}

/* ---------- 设置 / 通用列表 ---------- */
.sec{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.seclabel{font-size:11.5px;font-weight:500;color:var(--faint);padding-left:4px}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:24px;overflow:hidden;
  box-shadow:0 3px 14px rgba(217,168,125,.13)}
.row{display:flex;align-items:center;gap:9px;padding:14px 16px;cursor:pointer}
.row:active{background:#FFFAF3}
.row .rname{font-size:14.5px;font-weight:700}
.row .rtime{font-family:var(--fn);font-size:12.5px;font-weight:600;color:var(--deep)}
.row .rgap{flex:1}
.pill{padding:4px 9px;border-radius:9px;background:var(--light);font-size:10.5px;
  font-weight:700;color:#C09A7A;white-space:nowrap}
.divider{height:1px;background:var(--line);margin:0 16px}
.row.addr{color:var(--main);font-weight:700;font-size:13.5px;gap:8px}
.rowtxt{font-size:11.5px;color:var(--faint);line-height:1.55;padding:0 16px 15px}

/* ---------- 手账写作页 ----------
   这张「纸」刻意不铺满整屏：
     · 写碎碎念就两三句，纸撑到屏幕底反而显得挤，下方留白才是气口；
     · 更实际的是键盘 —— 弹起来以后整张纸（含 iOS 那条 ^ v ✓ 工具条）能一次看全，
       不用一边打字一边滚，所以高度按 44vh 走，小屏上也自动收窄。 */
.editor{background:#fff;border:1.5px solid var(--line);border-radius:26px;padding:20px;
  flex:0 1 auto;height:min(44vh,330px);min-height:200px;display:flex;
  box-shadow:0 3px 14px rgba(217,168,125,.13)}
/* 字号必须 ≥16px：iOS 在聚焦小于 16px 的输入控件时会自动放大整页，
   而且退出以后不会自己缩回去 —— 表现就是"进过一次手账，主页就变大了"。 */
.editor textarea{width:100%;border:none;outline:none;resize:none;font-family:var(--fb);
  font-size:16px;line-height:2;color:var(--text);background:transparent}
.editor textarea::placeholder{color:#D8C9B6}

/* ---------- 回顾 ---------- */
.cal{background:#fff;border:1.5px solid var(--line);border-radius:26px;padding:18px 16px 16px;
  box-shadow:0 3px 14px rgba(217,168,125,.13);flex:0 0 auto}
.mstat{display:flex;align-items:baseline;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mnum{font-family:var(--fn);font-weight:700;font-size:42px;color:var(--main);line-height:1}
.mlab{font-size:12.5px;color:var(--faint);font-weight:500}
.mchg{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#C9AC92;font-size:15px;line-height:1;user-select:none}
.mchg:active{background:#F7EEE3}
.mmon{font-size:12.5px;color:#B79A7C;font-weight:700}
.dotsgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px 6px;justify-items:center}
.pd{width:15px;height:15px;border-radius:50%;background:#F3E7DA;cursor:pointer;transition:.15s}
.pd.lv1{background:#FFE9D2}
.pd.lv2{background:#FFCB9C}
.pd.lv3{background:#FFAE6E}
.pd.picked{box-shadow:0 0 0 2.5px var(--main)}
.pd.today{box-shadow:0 0 0 2px var(--deep)}
.pd.today.picked{box-shadow:0 0 0 2.5px var(--main)}
.pd.future{background:transparent;box-shadow:inset 0 0 0 1.5px #F0E2D2;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:16px;font-size:10.5px;color:var(--faint)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.detail{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:16px;
  display:flex;flex-direction:column;gap:11px;flex:0 0 auto}
.detail-head{display:flex;align-items:center;justify-content:space-between}
.detail-date{font-size:14px;font-weight:700}
.detail-count{font-family:var(--fn);font-size:13.5px;font-weight:600;color:var(--main)}
.dline{display:flex;align-items:center;gap:10px;font-size:13px}
.dline .dc{width:19px;height:19px;flex:0 0 19px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:2px dashed #EADAC6}
.dline .dc.on{background:var(--done);border:2px solid var(--done)}
.dline .dc.on:after{content:"";width:8px;height:4.5px;border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg) translate(.5px,-1.5px)}
.dline .dn{flex:0 0 auto}
/* 计数型：名字后面接「· 5 / 8 杯」。不写动词，数字和单位自己说话 */
.dline .dcnt{font-family:var(--fn);font-size:11px;color:var(--faint);
  flex:0 0 auto;margin-left:-5px;white-space:nowrap}
.dline.off .dn{color:var(--faint)}
.dline .dg{flex:1;border-top:1.5px dashed var(--dash);min-width:6px}
.dline .dt{font-family:var(--fn);font-size:11.5px;color:var(--faint);white-space:nowrap}
.noteblock{background:var(--bg);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:7px}
.notelabel{font-size:11px;color:var(--faint);font-weight:500}
.notetext{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.noteblock .empty{font-size:12.5px;color:#D2C2AE}
.linknote{font-size:12px;font-weight:700;color:var(--main);cursor:pointer;align-self:flex-start}

/* ---------- 年度表 ---------- */
.ytable{background:#fff;border:1.5px solid var(--line);border-radius:22px;
  overflow-x:auto;overflow-y:hidden;flex:0 0 auto;box-shadow:0 3px 14px rgba(217,168,125,.13);
  scrollbar-width:none}
.ytable::-webkit-scrollbar{height:0}
.ytable table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.ytable th,.ytable td{padding:6px 5px;text-align:center;white-space:nowrap}
.ytable th{font-size:10.5px;color:var(--faint);font-weight:700;padding-bottom:10px}
.ytable td.h{position:sticky;left:0;background:#fff;text-align:left;padding-left:14px;padding-right:12px;
  font-weight:700;font-size:12.5px;color:var(--text);z-index:1;max-width:112px;overflow:hidden;text-overflow:ellipsis}
.ytable th.h{position:sticky;left:0;background:#fff;text-align:left;padding-left:14px;z-index:2}
.ytable td.n,.ytable td.tot{font-family:var(--fn);font-weight:600}
.cell{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;
  border-radius:11px;padding:0 7px;font-size:12.5px}
.cell.c0{background:transparent;color:#D6C4B0}
.cell.c1{background:#FFEDDD;color:#C08A5C}
.cell.c2{background:#FFD9B0;color:#A96A32}
.cell.c3{background:#FFAE6E;color:#fff}
.cell.tot{background:var(--light);color:var(--deep);font-weight:700;min-width:52px}

/* ---------- 汉堡（总览） ---------- */
.bgr-row{display:flex;align-items:center;gap:9px;padding:15px 16px;cursor:pointer}
.bgr-row:active{background:#FFFAF3}
/* 名字太长就收成省略号 —— 右边多了个箭头，不能让它把行挤破 */
.bgr-row .rname{font-size:16.5px;font-weight:700;line-height:1.3;
  flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bgr-row .rtime{font-family:var(--fn);font-size:14px;font-weight:600;color:var(--deep);
  flex:0 0 auto;white-space:nowrap}
.bgr-row .rgap{flex:1}
.bgr-row .pill{font-size:11.5px}
.bgr-row.off{opacity:.42}

/* ---------- 汉堡页：往左滑露出「删除」（像苹果备忘录） ----------
   行本身不改布局，外面套一层裁切框，删除按钮垫在行下面；
   行左移 SW_DEL_W 就把它露出来。 */
.swipe{position:relative;overflow:hidden;background:#fff}
.swipe .bgr-row{position:relative;z-index:1;background:#fff;touch-action:pan-y;
  transition:transform .26s cubic-bezier(.22,.61,.36,1)}
.swipe .bgr-row:active{background:#FFFAF3}
.swipe.open .bgr-row{transform:translateX(-82px)}
/* 整行透明会把红色透出来，所以「今天不生效」只淡化内容 */
.swipe .bgr-row.off{opacity:1}
.swipe .bgr-row.off > *{opacity:.42}
.swipe-del{position:absolute;top:0;right:0;bottom:0;width:82px;
  display:flex;align-items:center;justify-content:center;
  background:#E4625B;color:#fff;font-size:14.5px;font-weight:700;
  letter-spacing:.08em;cursor:pointer}
.swipe-del:active{background:#D25049}

/* ---------- 说明书（第一次打开盖一层，看完就没了） ----------
   为什么是 fixed：真机上就是铺满整屏；桌面预览时 .phone 有外框，
   改用 absolute 贴住手机框，免得盖到窗口外面去。 */
.howto{position:fixed;inset:0;z-index:95;background:var(--bg);
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 0 calc(env(safe-area-inset-bottom) + 10px);
  animation:hShow .24s ease}
@keyframes hShow{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@media (min-width:560px) and (hover:hover) and (pointer:fine){
  .howto{position:absolute;border-radius:38px}
}
.hx{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 10px);z-index:3;
  width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  color:#B9A48E;cursor:pointer}
.hx:active{opacity:.5}
.hview{flex:1;overflow:hidden;display:flex;min-height:0}
.htrack{display:flex;width:100%;transition:transform .3s cubic-bezier(.22,.61,.36,1)}
.hpage{flex:0 0 100%;padding:30px 24px 4px;display:flex;flex-direction:column;
  justify-content:center;gap:20px;overflow:hidden}
.hfoot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px 2px;min-height:52px}
.hdots{display:flex;gap:7px;align-items:center}
.hdots i{width:7px;height:7px;border-radius:4px;background:#EBDCC9;transition:.22s}
.hdots i.on{width:20px;background:var(--deep)}
.hnext{display:flex;align-items:center;justify-content:center;
  height:46px;min-width:46px;padding:0;border-radius:23px;background:var(--main);
  color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 16px rgba(232,148,92,.3);transition:padding .2s}
.hnext.wide{padding:0 22px}
.hnext:active{transform:scale(.95)}
.htxt{display:flex;flex-direction:column;gap:9px}
.htitle{font-family:var(--ft);font-size:24px;line-height:1.25;color:var(--text)}
.hdesc{font-size:14.5px;line-height:1.7;color:#6E5D4E}
.hdesc b{color:var(--anchor);font-weight:700}
.htip{background:#FFF3E4;border:1.5px dashed #F0D6B8;border-radius:14px;
  padding:10px 13px;font-size:13px;line-height:1.6;color:#9A7A58}
.htip b{color:#C07A3C;font-weight:700}

/* ---------- 说明书里的「示意界面」 ----------
   自己画一套，不用真截图：字是矢量的、离线白拿、以后改今天页也不会连累它。 */
.mini{background:var(--bg);border:1.5px solid var(--line);border-radius:20px;
  padding:14px 15px 15px;display:flex;flex-direction:column;gap:8px;
  justify-content:center;min-height:172px;
  box-shadow:0 5px 20px rgba(217,168,125,.14);flex:0 0 auto}
.mi-date{font-size:10.5px;color:#C9AC92;font-weight:700}
.mi-label{font-size:10px;color:#C0AC99;font-weight:700;letter-spacing:.1em;margin-top:2px}
.mi-anchor{display:flex;align-items:center;gap:7px}
.mi-an{font-size:13px;font-weight:700;color:var(--anchor)}
.mi-at{font-family:var(--fn);font-size:12px;font-weight:600;color:var(--deep)}
.mi-dash{flex:1;border-top:1.5px dashed var(--dash)}
.mi-task{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:9px 11px}
.mi-chk{width:14px;height:14px;border-radius:50%;border:1.8px solid #E6D5C2;flex:0 0 14px}
.mi-chk.on{background:var(--done);border-color:var(--done)}
.mi-tt{font-size:13px;font-weight:700;color:var(--text)}
.mi-box{position:relative;padding:9px 11px;margin:0 -7px;border-radius:14px;
  box-shadow:0 0 0 2px var(--main);display:flex;flex-direction:column;gap:8px}
.mi-num{position:absolute;top:-10px;left:-10px;width:20px;height:20px;border-radius:50%;
  background:var(--main);color:#fff;font-family:var(--fn);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(232,148,92,.35)}
/* 新增页示意 */
.mi-field{background:#fff;border:1.5px solid var(--line);border-radius:12px;
  padding:10px 12px;font-size:13.5px;font-weight:700;color:var(--text);display:flex;
  align-items:center;gap:2px}
.mi-caret{display:inline-block;width:1.5px;height:15px;background:var(--main);
  animation:miCaret 1.1s steps(1) infinite}
@keyframes miCaret{0%,49%{opacity:1}50%,100%{opacity:0}}
.mi-dots{display:flex;gap:5px}
.mi-dots i{flex:1;height:26px;border-radius:9px;background:#fff;border:1.5px solid var(--line);
  font-style:normal;font-size:10.5px;font-weight:700;color:#C0AC99;
  display:flex;align-items:center;justify-content:center}
.mi-dots i.on{background:var(--light);border-color:#F3D6B8;color:var(--deep)}
.mi-row{display:flex;align-items:center;gap:8px}
.mi-row .mi-k{font-size:12.5px;font-weight:700;color:var(--text)}
.mi-row .mi-v{font-family:var(--fn);font-size:12px;font-weight:600;color:var(--deep)}
.mi-sw{width:38px;height:22px;border-radius:11px;background:#EFE3D5;position:relative;
  flex:0 0 38px}
.mi-sw i{position:absolute;top:2.5px;left:2.5px;width:17px;height:17px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mi-sw.on{background:var(--main)}
.mi-sw.on i{left:18.5px}
/* 左滑露删除 */
.mi-srow{position:relative;border-radius:12px;overflow:hidden}
.mi-srow .mi-del{position:absolute;top:0;right:0;bottom:0;width:58px;background:#E4625B;
  color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;
  justify-content:center;letter-spacing:.06em}
.mi-srow .mi-task{border-radius:12px;transform:translateX(-58px)}
/* 回顾页示意：必须跟真回顾页一个长相——两张白卡，上面按月日历、下面那天明细。
   真页面就是这么两块（04-review.png 可对照），这里连图例的措辞都照抄。
   注意：这不是年度表（事项×月份那套 .mi-table 在文件末尾，留给完整版单开一页讲）。 */
.mini.plain{background:transparent;border:none;box-shadow:none;padding:0;
  gap:10px;min-height:0;justify-content:flex-start}
.mi-card{background:#fff;border:1.5px solid var(--line);border-radius:18px;
  padding:12px 13px;display:flex;flex-direction:column;gap:8px}
.mi-mstat{display:flex;align-items:baseline;gap:5px}
.mi-mnum{font-family:var(--fn);font-size:21px;font-weight:700;color:var(--main);line-height:1}
.mi-mlab{font-size:10px;font-weight:700;color:#C9B49C}
.mi-mnav{margin-left:auto;display:flex;align-items:center;gap:7px;
  font-size:10.5px;font-weight:700;color:#B79A7C;align-self:center}
.mi-mnav .ar{color:#C9B49C}
.mi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px 4px;justify-items:center}
.mi-grid i{width:12px;height:12px;border-radius:50%;background:#F3E7DA}
.mi-grid i.a{background:#FFE9D2}
.mi-grid i.b{background:#FFCB9C}
.mi-grid i.c{background:#FFAE6E}
.mi-grid i.pk{box-shadow:0 0 0 2px var(--main)}
.mi-legend{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:9.5px;font-weight:600;color:#C9AC92}
.mi-legend span{display:flex;align-items:center;gap:4px}
.mi-legend i{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#F3E7DA}
.mi-legend i.a{background:#FFE9D2}
.mi-legend i.b{background:#FFCB9C}
.mi-legend i.c{background:#FFAE6E}
.mi-dhead{display:flex;align-items:center;justify-content:space-between;
  font-size:10.5px;font-weight:700;color:var(--text)}
.mi-dhead .mi-cnt{font-family:var(--fn);font-size:10.5px;color:var(--main)}
.mi-dl{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text)}
.mi-dl .mi-dc{width:12px;height:12px;flex:0 0 12px;border-radius:50%;
  background:var(--done);display:flex;align-items:center;justify-content:center}
.mi-dl .mi-dc:after{content:"";width:5px;height:2.8px;
  border-left:1.6px solid #fff;border-bottom:1.6px solid #fff;
  transform:rotate(-45deg) translate(.3px,-.95px)}
.mi-dl .mi-dg{flex:1;border-top:1.2px dashed var(--dash);min-width:6px}
.mi-dl .mi-dt{font-family:var(--fn);font-size:9.5px;color:#C9AC92;white-space:nowrap}
/* 真页面最下面那行「看这一年的」，示意里也留一行，免得对不上 */
.mi-card.mi-more{flex-direction:row;align-items:center;gap:6px;padding:9px 12px}
.mi-more .mi-mt{font-size:11px;font-weight:700;color:var(--text)}
.mi-pill{margin-left:auto;background:var(--light);border-radius:9px;padding:2px 8px;

/* ============================================================================
 * 汉堡包计划
 * ----------------------------------------------------------------------------
 * 模型（开发方案第 3 节，全项目唯一需要重新想的地方）：
 *   锚点 = 一天里固定会发生的时刻（可带时间，可按星期不同），不参与打卡
 *   事项 = 今天要做的事
 *   两者是【分配】关系，不是【归属】关系
 *   → 锚点今天不开门时，它下面的事项回到「未分配」，不是消失
 *
 * 三条硬约束：
 *   ① 「未分配」是算出来的，不落盘（零写操作）
 *   ② 安排按「星期几」分别存（0=周日 … 6=周六，跟 getDay() 对齐）

/* ---------------- 常量 ---------------- */
const WEEK = ['日','一','二','三','四','五','六'];
const ALL  = [0,1,2,3,4,5,6];

const WE   = [0,6];

   localStorage 一般是 5 MB 一个站点；3 MB 就提示，留出备份的余地。 */
const SAVE_WARN_AT = 3 * 1024 * 1024;

/* ---------------- 工具 ---------------- */
const pad  = n => String(n).padStart(2,'0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const pdate= k => new Date(k + 'T12:00:00');

/* 存档占用：按 UTF-8 字节算（中文一个字 3 字节），跟 localStorage 的计数口径一致 */
function fmtBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n < 10240 ? (n/1024).toFixed(1) : Math.round(n/1024)) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
}
function dataSize(str){
  const s = str || '{}';
  try{ return new Blob([s]).size; }catch(e){ return s.length; }
}

/* ---------------- 计数型事项（一天几次） ----------------
   「喝水 8 杯」和「写作日记」是同一个东西，唯一差别是完成判定：
   一次打勾 vs 累计 N 次。所以只给 habits 加一个**可选**的 target，
   不新增实体、不新增开关。计数旁挂在 counts 上，logs 的语义一个字不动。 */

/* 把「一天几次」输入框里的字认成 {times, unit}。认不出来返回 null = 普通事项。
   ⚠️ 全角数字必须先转半角：中文输入法下打出「８ 杯」是常事，不转就会被判成
   "没有数字"，静默退化成普通事项，而提示还在说"填个数字"——她明明填了。 */
function parseTarget(raw){
  let s = String(raw == null ? '' : raw).trim();
  if(!s) return null;
  s = s.replace(/[\uFF10-\uFF19]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));

  const m = s.match(/^(\d{1,3})\s*(.{0,3}?)\s*$/);
  if(!m) return null;
  const times = Number(m[1]);
  const unit = (m[2] || '').trim();

  if(/\d/.test(unit)) return null;      // 8 杯8 → 她写乱了，判失败，别猜也别修剪
  if(!(times >= 2)) return null;        // 0 / 1 次就是普通事项，别造出「1 / 1」
  return { times: Math.min(times, 99), unit };
}

/* ============================================================================
 * store —— 唯一的读写入口
 *   所有写操作必须走 store.mutate；任何地方都不允许直接 localStorage.setItem。
 *   守住这条，M2 接云同步时就只是接一根线。
 * ========================================================================*/
const store = (() => {
  let S = null;
  const subs = [];

  function seed(){
    return {
      updatedAt: 0,
      anchors: [
        { id:'a1', title:'起床后',   order:1, deleted:false, rules:[{ days:WD.slice(),           start:'7:00',  end:null }] },
        { id:'a4', title:'周末起床', order:2, deleted:false, rules:[{ days:WE.slice(),           start:'9:00',  end:null }] },
        { id:'a2', title:'午饭后',   order:3, deleted:false, rules:[{ days:ALL.slice(),          start:'12:00', end:'12:30' }] },
        { id:'a3', title:'下班进门', order:4, deleted:false, rules:[{ days:WD.slice(),           start:'18:30', end:null }] }
      ],
      habits: [
        { id:'h1', title:'冥想 10 分钟', mini:'太忙就 3 次深呼吸',       icon:'med',  order:1, archived:false,
          placement:{ 0:'a4', 1:'a1', 2:'a1', 3:'a1', 4:'a1', 5:'a1', 6:'a4' } },
        { id:'h2', title:'散步 15 分钟', mini:'太忙就 站起来走两分钟',   icon:'walk', order:2, archived:false,
          placement:{ 0:'a2', 1:'a2', 2:'a2', 3:'a2', 4:'a2', 5:'a2', 6:'a2' } },
        /* 阅读每天都做，挂在「下班进门」后面 —— 那个锚点周末不开门，
           所以周六日它自动回到「未分配」。这正是整个模型的演示。 */
        { id:'h3', title:'阅读 15 分钟', mini:'太忙就 读 1 页',         icon:'book', order:3, archived:false,
          placement:{ 0:'a3', 1:'a3', 2:'a3', 3:'a3', 4:'a3', 5:'a3', 6:'a3' } }
      ],
      extras: {},
      logs:   {},
      counts: {},
      notes:  {}
    };
  }

  /* 补齐老数据缺的字段（将来接云同步时，两端版本不一致也靠它兜底） */
  function migrate(s){
    s = s || {};
    s.updatedAt = s.updatedAt || 0;
    s.seenHowto = !!s.seenHowto;      // 说明书看过没有（存这儿，导出备份再恢复不会重复弹）
    s.anchors = Array.isArray(s.anchors) ? s.anchors : [];
    s.habits  = Array.isArray(s.habits)  ? s.habits  : [];
    s.extras  = s.extras || {};
    s.logs    = s.logs   || {};
    s.counts  = s.counts || {};
    s.notes   = s.notes  || {};
    s.anchors.forEach(a => {
      a.order = a.order || 0;
      a.deleted = !!a.deleted;
      if(!Array.isArray(a.rules) || !a.rules.length) a.rules = [{ days: ALL.slice(), start:null, end:null }];
      a.rules.forEach(r => {
        r.days = Array.isArray(r.days) ? r.days.filter(d => d>=0 && d<=6).sort((x,y)=>x-y) : ALL.slice();
        r.start = r.start || null;
        /* 老数据里可能已经存了 end:"0:00"（她打了 0 想删掉结束时间），顺手清掉 */
        r.end   = noEnd(r.end) || null;
      });
    });
    s.habits.forEach(h => {
      h.order = h.order || 0;
      h.archived = !!h.archived;
      h.placement = h.placement || {};
      /* target 是可选字段：没有 / 认不出来 = 一次打勾。老数据没有它，天然就是普通事项，
         所以加这个字段**不需要迁任何历史数据**。 */
      const t = h.target;
      h.target = (t && Number(t.times) >= 2)
        ? { times: Math.min(Math.round(Number(t.times)), 99), unit: String(t.unit || '').slice(0, 3) }
        : null;
    });
    return s;
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return migrate(JSON.parse(raw));
    }catch(e){}
    return seed();
  }

  S = load();

  let saveFail = false;

  /* 写盘。失败时**绝不能装作成功**：存储满了或者隐私模式下 setItem 会抛，
     她以为这一下记上了、其实没写进去，是最坏的一种丢数据。 */
  function persist(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(S));
      saveFail = false;
    }catch(e){
      /* 只提示本次会话的第一次，别每点一下都弹 */
      if(!saveFail){ try{ toast('这次没存上 —— 去设置里导出备份'); }catch(_){} }
      saveFail = true;
    }
  }

  /* M1：脏队列只写不消费。M2 接云同步时只补消费端，页面代码一行不改。 */
  function markDirty(){
    try{
      const d = JSON.parse(localStorage.getItem(DIRTY_KEY) || '[]');
      d.push(S.updatedAt);
      localStorage.setItem(DIRTY_KEY, JSON.stringify(d.slice(-200)));
    }catch(e){}
  }

  function fire(){ subs.forEach(cb => { try{ cb(S); }catch(e){} }); }

  return {
    read(){ return S; },
    saveFailed(){ return saveFail; },
    mutate(fn){
      fn(S);
      S.updatedAt = Date.now();
      persist();
      markDirty();
      fire();
    },
    subscribe(cb){ subs.push(cb); },
    snapshot(){ return JSON.stringify(S, null, 2); },
    /* 从备份恢复：走和 load 同一套 migrate，老备份也吃得进来 */
    replace(raw){
      const next = migrate(JSON.parse(raw));
      S = next;
      S.updatedAt = Date.now();
      persist();
      markDirty();
      fire();
    },
    reset(){
      S = seed(); S.updatedAt = Date.now();
      persist(); fire();
    }
  };
})();

/* 今天出现哪些锚点 */
/* "8:00-10:00" → 480（分钟）。没填时间的给 Infinity，排序时自然沉到最后 */
function timeToMinutes(t){
  if(!t) return Infinity;
  const p = normTime(String(t).split('-')[0]);
  if(!p) return Infinity;
  const parts = p.split(':');
  return (+parts[0]) * 60 + (+parts[1]);
}

function anchorsOn(w){
  const list = store.read().anchors
    .filter(a => !a.deleted && a.rules.some(r => r.days.includes(w)));
  /* 按当天的锚点时间排 —— 早上 8 点的一定排在最前面，没填时间的排最后 */
  list.sort((x, y) => {
    const tx = timeToMinutes(anchorTime(x, w));
    const ty = timeToMinutes(anchorTime(y, w));
    if(tx !== ty) return tx - ty;
    return (x.order || 0) - (y.order || 0);
  });
  return list;
}

/* 不分星期的那份（汉堡页 / 设置页用）：按第一条规则的时间排 */
function anchorsAll(){
  return store.read().anchors
    .filter(a => !a.deleted)
    .sort((x, y) => {
      const tx = timeToMinutes(x.rules[0] && x.rules[0].start);
      const ty = timeToMinutes(y.rules[0] && y.rules[0].start);
      if(tx !== ty) return tx - ty;
      return (x.order || 0) - (y.order || 0);
    });
}
function anchorTime(a, w){
  const r = a.rules.find(r => r.days.includes(w));
  if(!r) return '';
  if(!r.start) return '';
  const e = noEnd(r.end);
  return e ? `${r.start}-${e}` : r.start;
}

/* 手机的数字键盘打不出冒号，所以时间允许直接写数字：
     8 / 08 → 8:00      800 / 830 → 8:00 / 8:30      1830 → 18:30
   也认 8:00、18：30（中文冒号）。认得出就统一成 H:mm，认不出返回 null，
   交回调用方决定是提示还是丢掉。 */
function normTime(raw){
  let v = String(raw == null ? '' : raw).trim().replace(/[：.．、,，]/g, ':');
  if(!v) return '';
  let h, m;
  if(v.indexOf(':') >= 0){
    const p = v.split(':');
    if(p.length > 2) return null;
    h = p[0]; m = (p[1] === '' || p[1] == null) ? '0' : p[1];
  }else{
    if(!/^\d+$/.test(v)) return null;
    if(v.length <= 2){ h = v; m = '0'; }
    else if(v.length === 3){ h = v.slice(0,1); m = v.slice(1); }
    else if(v.length === 4){ h = v.slice(0,2); m = v.slice(2); }
    else return null;
  }
  if(!/^\d{1,2}$/.test(h) || !/^\d{1,2}$/.test(m)) return null;
  const H = +h, M = +m;
  if(H > 23 || M > 59) return null;
  return H + ':' + String(M).padStart(2, '0');
}
/* 结束时间填成 0:00 一律当"没填"。
   时间段的终点不可能是半夜零点，而她本来是想"把后面那组删掉"，打了个 0 而已 ——
   结果被存成 12:00-0:00，看着像坏数据。 */
function noEnd(v){ return (!v || v === '0:00') ? '' : v; }

/* 把 "8:00" 拆成小时框 / 分钟框要显示的两段：["08","00"]。
   小时补两位显示（08 而不是 8），是为了让"这是小时"一眼看得出来；
   存库仍然是 normTime 的样子（8:00），别的屏不用跟着改。 */
function splitTime(s){
  const t = normTime(s);
  if(!t) return ['', ''];
  const p = t.split(':');
  return [p[0].padStart(2, '0'), p[1]];
}
/* 一个人话标签：每天 / 工作日 / 周末；不是这三种就直接列 */
function cycleLabel(days){
  const d = days.slice().sort((x,y)=>x-y);
  if(d.length===7) return '每天';
  if(d.join()==='1,2,3,4,5') return '工作日';
  if(d.join()==='0,6') return '周末';
  if(!d.length) return '哪天都不';
  return d.map(i => '周'+WEEK[i]).join('、');
}

/* 某一天的布局：锚点分组 + 未分配（未分配是算出来的，不落盘） */
function layoutFor(dateKey){
  const S = store.read();
  const w = wdOf(dateKey);
  const log = S.logs[dateKey] || [];
  const dayCounts = S.counts[dateKey] || {};
  const as = anchorsOn(w);
  const groups = as.map(a => ({ a, w, items: [] }));
  const un = [];
  const t = at => anchorTime(at, w);

  const push = it => {
    /* 只有在「今天开门的锚点」里找得到家，才进组；否则一律回未分配。
       锚点今天不开门 → 它下面的事项自动浮上来 —— 零写操作。 */
    const g = it.anchorId ? groups.find(g => g.a.id === it.anchorId) : null;
    (g ? g.items : un).push(it);
  };

  S.habits
    .filter(h => !h.archived)
    .sort((a,b) => (a.order||0) - (b.order||0))
    .forEach(h => {
      if(!(w in h.placement)) return;                  // 这天本来就不做 → 完全不出现
      const placed = h.placement[w];
      const tg = h.target || null;
      const cnt = dayCounts[h.id] || 0;
      push({ type:'habit', id:h.id, title:h.title, mini:h.mini, icon:h.icon,
             target: tg, count: cnt,
             /* 达标 = logs 里有 或者 次数已经够了。
                后半个条件兜住「把 8 次改成 5 次」这种改目标的当天：counts 没删，显示立刻跟上。 */
             done: log.includes(h.id) || !!(tg && cnt >= tg.times),
             anchorId: placed === null ? null : placed,
             origAnchorId: placed === null ? null : placed,
             anchorName: null, anchorT: null });
    });

  (S.extras[dateKey] || []).forEach(e => {
    push({ type:'extra', id:e.id, title:e.title, mini:e.mini, icon:e.icon || 'default',
           done: !!e.done, anchorId: e.anchorId || null, origAnchorId: e.anchorId || null });
  });

  /* 把锚点名称 / 时间带上（回顾明细要用） */
  const byId = {};
  S.anchors.forEach(a => { byId[a.id] = a; });
  groups.forEach(g => g.items.forEach(it => { it.anchorName = g.a.title; it.anchorT = t(g.a); }));
  un.forEach(it => { it.anchorName = null; it.anchorT = null; });

  return { groups, un, w };
}

/* 今天页副标题：有人沉到未分配 = "锚点不开门"，否则常态 */
function headerSub(){
  if(ui.drag) return '拖到任意两个锚点之间都行';
  const { groups, un, w } = layoutFor(tkey());
  const S = store.read();
  const stranded = un.some(it => it.type === 'habit' && !it.target && it.origAnchorId &&
    !groups.some(g => g.a.id === it.origAnchorId) &&
    !!S.anchors.find(a => a.id === it.origAnchorId));
  if(stranded) return '锚点不开门，事情还在';
  return '别看时间，看事件';
}

/* 圈换样子不换位置：还是 25px、还在原位。
   普通事项 = 虚线圈；计数型 = 进度弧（1–9 才在圈里写数字，>=10 只留弧）；到量 = 绿勾。 */
const chkAttr = it => `data-act="check" data-type="${it.type}" data-id="${esc(it.id)}"`;

function chkHTML(it){
  const attr = chkAttr(it);
  if(!it.target) return `<div class="chk${it.done?' on':''}" ${attr}></div>`;
  if(it.done)    return `<div class="chk on" ${attr}></div>`;

  const t = it.target;
  const n = Math.min(it.count || 0, t.times);
  const C = 2 * Math.PI * 10;                       // r = 10
  const arc = n ? `<circle cx="12.5" cy="12.5" r="10" fill="none" stroke="#E8945C" stroke-width="2.4"
        stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}"
        stroke-dashoffset="${(C * (1 - n / t.times)).toFixed(2)}"
        transform="rotate(-90 12.5 12.5)"/>` : '';
  const num = (n && t.times <= 9) ? `<span class="cnum">${n}</span>` : '';
  return `<div class="chk ring" ${attr}><svg viewBox="0 0 25 25" width="25" height="25">
      <circle cx="12.5" cy="12.5" r="10" fill="none" stroke="#F0DCC8" stroke-width="2.4"/>${arc}
    </svg>${num}</div>`;
}

function taskHTML(it){
  const dragging = ui.drag && ui.drag.type === it.type && ui.drag.id === it.id;
  /* 计数型的副标题优先（它是会变的那条）；「太忙时的最小版」还留着，接在后面 */
  const cnt = it.target ? `今天 ${countText(it.count, it.target)}` : '';
  const sub = dragging
    ? (it.origAnchorId ? '原来挂在「' + esc(anchorTitle(it.origAnchorId)) + '」后面' : '原来还没安排')
    : [cnt, it.mini ? esc(it.mini) : ''].filter(Boolean).join(' · ');
  return `<div class="task${it.done?' done':''}" data-type="${it.type}" data-id="${esc(it.id)}">
    <div class="ico">${ICON[it.icon] || ICON.default}</div>
    <div class="tt">
      <div class="t1">${esc(it.title)}</div>
      ${sub ? `<div class="t2">${sub}</div>` : ''}
    </div>
    ${chkHTML(it)}
    <i class="hit" ${chkAttr(it)}></i>
  </div>`;
}

function anchorTitle(id){
  const a = store.read().anchors.find(x => x.id === id);
  return a ? a.title : '';
}

function todayHTML(){
  const { groups, un } = layoutFor(tkey());
  const dragging = !!ui.drag;

  /* 计数型（一天 N 次）先挑出来单独放一栏：
     它们一整天都在进行，不是"打个勾就结束"的事，
     所以既不参与锚点排序，也不进「已完成」区 —— 到量了留在原位变绿就行。 */
  const habits = [];
  groups.forEach(g => g.items.forEach(it => { if(it.target) habits.push(it); }));
  un.forEach(it => { if(it.target) habits.push(it); });

  /* 已经打过勾的，从原来的位置抽出来，统一放到下面的「已完成」区 */
  const dones = [];
  groups.forEach(g => g.items.forEach(it => { if(it.done && !it.target) dones.push(it); }));
  un.forEach(it => { if(it.done && !it.target) dones.push(it); });

  let h = headerHTML();

  if(habits.length){
    const hit = habits.filter(it => it.done).length;
    h += `<div class="habitsec">
        <div class="habit-head"><span class="hs-title">习惯</span>
          <span class="hs-num">${hit} / ${habits.length}</span></div>
        ${habits.map(taskHTML).join('')}
      </div>`;
  }

  h += `<div class="timeline">`;

  for(const g of groups){
    const t = anchorTime(g.a, g.w);
    const items = g.items.filter(it => !it.done && !it.target);
    if(!dragging && !items.length){
      /* 锚点降级：今天没事项安排在这儿的，不画图钉和虚线，压成一行小字 */
      h += `<div class="anchor-mini" data-anchor="${esc(g.a.id)}">
          <span class="am-name">${esc(g.a.title)}</span>
          ${t ? `<span class="am-time">${t}</span>` : ''}
        </div>`;
      continue;
    }
    h += `<div class="anchor-row" data-anchor="${esc(g.a.id)}">
        ${ICON.pin}
        <span class="a-name">${esc(g.a.title)}</span>
        ${t ? `<span class="a-time">${t}</span>` : ''}
        <span class="a-dash"></span>
      </div>`;
    items.forEach(it => h += taskHTML(it));
    if(dragging) h += `<div class="slot" data-slot="${esc(g.a.id)}">松手就挂在这里</div>`;
  }

  const unLeft = un.filter(it => !it.done && !it.target);
  if(unLeft.length || dragging){
    if(unLeft.length){
      h += `<div class="unassigned">
        <div class="un-head">
          <span class="un-title">未分配</span>
        </div>
        ${unLeft.map(taskHTML).join('')}
        ${dragging ? `<div class="slot un-slot" data-slot="none">松手 → 今天先不安排</div>` : ''}
      </div>`;
    }else{
      h += `<div class="slot un-slot" data-slot="none">松手 → 今天先不安排</div>`;
    }
  }

  if(dones.length){
    h += `<div class="donesec">
        <div class="done-head"><span class="done-title">已完成</span><span class="done-num">${dones.length}</span></div>
        ${dones.map(taskHTML).join('')}
      </div>`;
  }
  h += `</div>`;

  h += `<div class="dragfoot${dragging?' on':''}"><span class="l">松手就生效</span><span>不用确认，也不用保存</span></div>`;
  h += `<div class="spacer"></div>`;
  h += `<div class="note-entry" data-act="open-note">${ICON.pen}<span>${store.read().notes[tkey()] ? '碎碎念 · 今天写了' : '碎碎念'}</span></div>`;
  h += `<div class="add-row" data-act="open-add"><span class="plus">＋</span><span>加一个 · 事项或锚点</span></div>`;
  return h;
}

function dotsHTML(kind, list){
  return `<div class="dots">` + WEEK.map((w,i) =>
    `<div class="dot${list.includes(i)?' on':''}" data-act="day" data-kind="${kind}" data-day="${i}">${w}</div>`

}

function previewText(){
  const f = ui.form;
  const t = f.title.trim() || '（还没写）';
  if(f.isAnchor){
    const ds = cycleLabel(f.aDays);
    /* 预览里就把 800 显示成 8:00 —— 这是"她打的东西被认出来了"最直接的反馈 */
    const t1 = normTime(f.start), t2 = normTime(f.end);
    const a = t1 === null ? f.start : t1;
    const b = t2 === null ? f.end  : t2;
    const time = a ? (b ? `${a}-${b}` : a) : '不填时间';
    return `${ds} · ${time} · ${t}`;
  }
  const where = f.anchorId ? anchorTitle(f.anchorId) : '';
  const life = f.resident
    ? ('常驻 · ' + cycleLabel(f.days))
    : '只有今天';
  /* 计数只属于常驻事项：一次性事项只活在今天，计数没有意义，所以关掉常驻时它不生效 */
  const tgt = f.resident ? f.target : null;
  const cnt = tgt ? `一天 ${tgt.times} ${tgt.unit || '次'}` : '';
  /* 计数型没有挂载点这回事，别在预览里留一句"先不挂"让她以为还要选 */
  const place = tgt ? '' : (where ? '挂在' + where : '先不挂');
  return [life, place, cnt].filter(Boolean).join(' · ');
}

function addHTML(){
  const f = ui.form;
  const isEdit = !!f.type;
  const isAnchor = f.isAnchor;
  /* 新增态也给一个返回箭头 —— 从汉堡页进来时不至于只能靠底部页签逃出去 */
  const nav = isEdit
    ? `<div class="sub-nav" data-act="back">${ICON.back}<span class="sub-date">改一下</span></div>`
    : `<div class="sub-nav" data-act="back">${ICON.back}<span class="sub-date">${fmtDate(todayD())}</span></div>`;
  const title = isAnchor ? '加一个' : '加一个';
  const sub   = isAnchor ? '设成锚点，顺便给个时间' : '事项，或者一个锚点';

  let h = nav;
  h += `<div class="sub-title">${title}<span class="spark" style="margin-left:6px">${ICON.spark}</span></div>`;
  h += `<div class="sub-sub">${sub}</div>`;

  h += `<div class="form">`;
  h += `<div class="sheet-grip"></div>`;

  /* 这一页能加三样东西：锚点、事项、一天几次的。所以不放"模板 / 分类"行 ——
     预设选项里只要摆了一条"喝水 8 杯"，整页读起来就变成"习惯专用页"。
     示例交给输入框自己的占位文字，谁都能在这儿填任何东西。 */
  h += `<div class="fld"><div class="flabel">做什么</div>
      <input class="finput" id="fTitle" value="${esc(f.title)}" placeholder="${isAnchor ? '例如：午休' : '例如：冥想 10 分钟'}" autocomplete="off"></div>`;

  /* 「一天要做几次」紧跟在「做什么」后面 —— 它是这张表单里第二重要的选择，
     不能夹在一堆开关中间当占位提示。留空 = 普通事项，填了 = 计数型（进「习惯」栏）。 */
  if(!isAnchor && f.type !== 'extra'){
    h += `<div class="fld"><div class="flabel">一天要做几次？</div>
        <input class="finput" id="fTarget" value="${esc(targetInput(f.target))}" placeholder="例如（喝水）8 杯" autocomplete="off">
        <div class="hint" id="fTargetHint">留空 = 只做一次。填了会进「习惯」栏，点一下加一次。</div></div>`;
  }

  if(!isEdit){
    h += `<div class="frow"><div><div class="ftxt">设为锚点</div>
        <div class="fdesc">固定事件，只当钉子用</div></div>
        <div class="switch${isAnchor?' on':''}" data-act="toggle-anchor"><i></i></div></div>`;
  }

  if(isAnchor){
    const [sh, sm] = splitTime(f.start);
    const [eh, em] = splitTime(f.end);
    h += `<div class="fld"><div class="flabel">哪几天</div>${dotsHTML('a', f.aDays)}</div>`;
    h += `<div class="fld"><div class="flabel">锚点时间（可留空）</div>
        <div class="time-row">
          <span class="tgroup">
            <input class="finput" id="fStartH" data-t="start" data-p="h" value="${esc(sh)}" placeholder="08" inputmode="numeric" maxlength="2" autocomplete="off">
            <span class="tcolon">:</span>
            <input class="finput" id="fStartM" data-t="start" data-p="m" value="${esc(sm)}" placeholder="00" inputmode="numeric" maxlength="2" autocomplete="off">
          </span>
          <span class="to">到</span>
          <span class="tgroup">
            <input class="finput" id="fEndH" data-t="end" data-p="h" value="${esc(eh)}" placeholder="09" inputmode="numeric" maxlength="2" autocomplete="off">
            <span class="tcolon">:</span>
            <input class="finput" id="fEndM" data-t="end" data-p="m" value="${esc(em)}" placeholder="00" inputmode="numeric" maxlength="2" autocomplete="off">
          </span>
        </div>
        <div class="hint">左边小时、右边分钟，分钟空着就算 00<br>结束那组留空 = 只有开始这一个时间点（填 0 也一样）<br>两组都不填也行</div></div>`;
  }else{
    h += `<div class="fld"><div class="flabel">太忙时的最小版（可留空）</div>
        <input class="finput" id="fMini" value="${esc(f.mini)}" placeholder="例如：太忙就 3 次深呼吸" autocomplete="off"></div>`;

    h += `<div class="fld"><div class="flabel">图标</div>
        <div class="picker">${ICON_ORDER.map(k =>
          `<div class="pick${f.icon===k?' on':''}" data-act="pick-icon" data-id="${k}">${ICON[k]}</div>`).join('')}</div></div>`;
    if(!isEdit || f.type === 'habit'){
      h += `<div class="frow"><div><div class="ftxt">常驻</div>
          <div class="fdesc">打开 = 每天都做；关着 = 只有今天</div></div>
          <div class="switch${f.resident?' on':''}" data-act="toggle-resident"><i></i></div></div>`;
    }
    if(f.resident){
      h += `<div class="fld"><div class="flabel">哪几天</div>${dotsHTML('h', f.days)}</div>`;
    }
    /* 按次数记的没有"某个时刻"可言 —— 它整天都在发生，所以不给锚点选择。
       上面那行说明已经讲清了它会待在「习惯」栏，这里不再重复一遍。 */
    if(!f.target){
      h += `<div class="fld"><div class="flabel">挂在哪个锚点后面</div><div class="chips">
        <div class="chip${f.anchorId===''?' on':''}" data-act="pick-anchor" data-id="">先不挂</div>
        ${anchorsOn(wd()).map(a =>
          `<div class="chip${f.anchorId===a.id?' on':''}" data-act="pick-anchor" data-id="${esc(a.id)}">${esc(a.title)}</div>`).join('')}
      </div></div>`;
    }
  }

  h += `<div class="preview">${esc(previewText())}</div>`;
  h += `<button class="btn" data-act="save-add">存下来</button>`;
  h += `</div>`;

  if(isEdit){
    h += `<div class="danger" data-act="delete-item"><span>删掉这个${isAnchor?'锚点':'事项'}</span></div>`;
  }

  h += `<div class="foot-note"><span>${isAnchor ? '锚点只当钉子' : (f.resident ? '按周循环，不用每天管' : '过了今天就不在了')}</span>
      <span>${isAnchor ? '不参与打卡' : ''}</span></div>`;
  return h;
}

/* 翻页只改 transform，不重渲染 —— 手指跟着走才顺 */
function howtoGo(n){
  const N = HOWTO_PAGES.length;
  n = Math.max(0, Math.min(N - 1, n));
  ui.howtoI = n;
  const track = $('hTrack');
  if(track) track.style.transform = `translateX(-${n * 100}%)`;
  const dots = $('hDots');
  if(dots) [...dots.children].forEach((d, k) => d.classList.toggle('on', k === n));
  const btn = $('hNext');
  if(btn){
    const last = n === N - 1;
    btn.classList.toggle('wide', last);
    btn.innerHTML = last ? '开始用' : H_ARROW;
  }
  const v = $('hView');
  if(v) v.scrollTop = 0;
}

function howtoClose(){
  store.mutate(S => { S.seenHowto = true; });
  ui.howtoI = 0;
  /* 从设置点进来的，关掉就回设置；开机自动弹的，关掉进今天页 */
  ui.screen = ui.howtoFrom || 'today';
  ui.howtoFrom = null;
  if(ui.screen === 'today' || ui.screen === 'burger' || ui.screen === 'review') ui.tab = ui.screen;
  render();
}

/* 左右滑翻页。只在说明书这层里认，关掉之后这段什么也不做。 */
let hDrag = null;
document.addEventListener('pointerdown', e => {
  hDrag = null;
  if(ui.screen !== 'howto') return;
  if(e.button !== undefined && e.button !== 0) return;
  if(e.target.closest('.hnext,.hx')) return;      // 按钮自己走 click
  hDrag = { x0: e.clientX, y0: e.clientY, on: false };
});
document.addEventListener('pointermove', e => {
  const d = hDrag;
  if(!d) return;
  const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
  if(!d.on){
    if(Math.abs(dx) < 9 && Math.abs(dy) < 9) return;
    if(Math.abs(dy) > Math.abs(dx)){ hDrag = null; return; }   // 她在上下划，不抢
    d.on = true;
    const t = $('hTrack');
    if(t) t.style.transition = 'none';
  }
  const v = $('hView'), t = $('hTrack');
  if(!v || !t) return;
  const W = v.getBoundingClientRect().width || 1;
  const i = ui.howtoI || 0;
  let x = -i * W + dx;
  if(x > 0) x *= .25;                                  // 第一页往右拉，给点阻尼
  if(x < -(HOWTO_PAGES.length - 1) * W) x = -(HOWTO_PAGES.length - 1) * W + (x + (HOWTO_PAGES.length - 1) * W) * .25;
  t.style.transform = `translateX(${x}px)`;
});
document.addEventListener('pointerup', e => {
  const d = hDrag; hDrag = null;
  if(!d || !d.on) return;
  const v = $('hView'), t = $('hTrack');
  if(t) t.style.transition = '';
  const W = v ? (v.getBoundingClientRect().width || 1) : 1;
  const dx = e.clientX - d.x0;
  const i = ui.howtoI || 0;
  if(dx < -W * .2 && i < HOWTO_PAGES.length - 1) howtoGo(i + 1);
  else if(dx > W * .2 && i > 0) howtoGo(i - 1);
  else howtoGo(i);                                     // 不够格，弹回去
});
document.addEventListener('pointercancel', () => {
  if(hDrag && hDrag.on) howtoGo(ui.howtoI || 0);
  hDrag = null;
});

/* ---------- 回顾 ---------- */
function calHTML(){
  const S = store.read();
  const y = ui.calM.y, m = ui.calM.m;
  const days = new Date(y, m+1, 0).getDate();
  const tk = tkey();

  let total = 0, cells = '';
  for(let i=1;i<=days;i++){
    const k = dkey(new Date(y, m, i));
    const c = (S.logs[k] || []).length;
    total += c;
    const fut = k > tk;
    const lv = fut ? '' : (c===0 ? '' : c===1 ? 'lv1' : c===2 ? 'lv2' : 'lv3');
    const cls = ['pd', lv, fut?'future':'', k===tk?'today':'', k===ui.reviewD?'picked':''].filter(Boolean).join(' ');
    cells += `<div class="${cls}" data-act="pick-day" data-date="${k}"></div>`;
  }

  return `<div class="cal">
    <div class="mstat">
      <span class="mnum">${total}</span>
      <span class="mlab">次 ·</span>
      <span class="mchg" data-act="mprev">‹</span>
      <span class="mmon">${m+1}月</span>
      <span class="mchg" data-act="mnext">›</span>

    <div class="dotsgrid">${cells}</div>
    <!-- 只解释颜色深浅这三档。空心圈＝还没到的日子、外圈＝今天，都是一眼就懂的，

    <div class="legend">

/* ---------- 年度表 ---------- */
function yearHTML(){
  const S = store.read();
  const y = todayD().getFullYear();
  const habits = S.habits.filter(h => !h.archived).sort((a,b)=>(a.order||0)-(b.order||0));

  const counts = habits.map(x => {
    const per = new Array(12).fill(0);
    for(const k in S.logs){
      const d = pdate(k);
      if(d.getFullYear() !== y) continue;
      if((S.logs[k] || []).includes(x.id)) per[d.getMonth()]++;
    }
    return per;
  });
  const maxN = Math.max(1, ...counts.flat());

  let h = `<div class="sub-nav" data-act="back">${ICON.back}</div>
    <div class="sub-title">这一年</div>
    <div class="sub-sub">${y} · 每个月做几次</div>`;

  h += `<div class="ytable"><table><thead><tr><th class="h">事项</th>`;
  for(let m=1;m<=12;m++) h += `<th>${m}月</th>`;
  h += `<th>全年合计</th></tr></thead><tbody>`;

  habits.forEach((x,idx) => {
    const per = counts[idx];
    const tot = per.reduce((a,b)=>a+b,0);
    h += `<tr><td class="h">${esc(x.title)}</td>`;
    per.forEach(n => {
      const lv = n===0 ? 0 : n <= maxN/3 ? 1 : n <= maxN*2/3 ? 2 : 3;
      h += `<td class="n">${n ? `<span class="cell c${lv}">${n}</span>` : `<span class="cell c0"></span>`}</td>`;
    });
    h += `<td class="tot"><span class="cell tot">${tot} 次</span></td></tr>`;
  });

  if(!habits.length) h += `<tr><td class="h" colspan="14" style="color:#C0AC99;font-weight:500">还没有长期事项</td></tr>`;
  h += `</tbody></table></div>`;
  h += `<div class="hint">只有次数，没有分母。一次性事项不进这张表。</div>`;
  h += `<div class="spacer"></div>`;
  return h;
}

  app.classList.toggle('subpage', s==='add' || s==='note' || s==='settings' || s==='year');

  const showTabs = (s==='today' || s==='burger' || s==='review' || s==='add');
  $('tabbar').style.display = showTabs ? '' : 'none';
  if(showTabs){
    if(s !== 'add') ui.tab = s;
    $('tabbar').innerHTML = tabbarHTML();
  }
  if(s === 'note'){
    const t = $('noteInput');
    if(t && !t.dataset.focused){
      t.dataset.focused = '1';
      t.focus();
      try{ t.setSelectionRange(t.value.length, t.value.length); }catch(e){}
    }
  }
  if(s === 'add') initPicker();
  if(s === 'today' && !ui.drag) app.scrollTop = keepTop;
}

 *   iOS 上走的是 Safari 的下载，文件落进「文件」App
 * ========================================================================*/
function exportBackup(){
  const blob = new Blob([store.snapshot()], { type:'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = '汉堡包计划-备份-' + dkey(new Date()) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('已存进「文件」App');
}

function importBackup(file){
  const r = new FileReader();
  const fail = () => toast('这个文件读不出来');
  r.onerror = fail;
  r.onload = () => {
    try{
      const txt = String(r.result);
      const o = JSON.parse(txt);
      /* 先确认是我们自己的备份，别把随便一个 json 灌进来 */
      if(!o || typeof o !== 'object' || !Array.isArray(o.anchors) || !Array.isArray(o.habits)) throw 0;
      store.replace(txt);
      ui.form = blankForm();
      ui.tab = 'today';
      ui.screen = 'today';
      render();
      toast('恢复好了');
    }catch(err){ fail(); }
  };
  r.readAsText(file);
}

/* ============================================================================
 * 写操作 —— 全部走 store.mutate
 * ========================================================================*/
/* 打勾：先让卡片滑走（300ms），再真正落库 + 重绘。
   重绘时如果拖到一半被人连着点，就直接落库，不排队等动画。 */
/* ---------- 打勾时的「滑到新位置」（FLIP） ----------
   她不要淡出消失，要"直接下移到已完成"。
   做法：重绘前把每张卡片 / 每个锚点行的位置记下来；重绘后先把它们用 transform
   推回原来那个位置，再动画归零 —— 视觉上就是卡片自己滑到了新位置，全程看得见。 */
/* 滑到新位置用多久（毫秒）。抽成变量是为了验证时能整体放慢拍成 GIF */
let FLIP_MS = 440;

function flipKey(el){
  if(el.classList.contains('task')) return 't|' + el.dataset.type + '|' + el.dataset.id;
  if(el.dataset.anchor) return 'a|' + el.dataset.anchor;
  return null;
}

function flipSnapshot(){
  const map = new Map();
  document.querySelectorAll('#app .task, #app [data-anchor]').forEach(el => {
    const key = flipKey(el);
    if(!key) return;
    const r = el.getBoundingClientRect();
    map.set(key, { top: r.top, left: r.left });
  });
  return map;
}

function flipPlay(prev){
  if(!prev || !prev.size) return;
  document.querySelectorAll('#app .task, #app [data-anchor]').forEach(el => {
    const key = flipKey(el);
    const p = key && prev.get(key);
    if(!p) return;
    const r = el.getBoundingClientRect();
    const dy = p.top - r.top, dx = p.left - r.left;
    if(Math.abs(dy) < 1 && Math.abs(dx) < 1) return;

    el.style.transition = 'none';
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    el.classList.add('flipping');
    /* 两帧：先让"退回原位"这帧真的画出来，再开始过渡，否则会被合并成一次跳变 */
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transition = `transform ${FLIP_MS / 1000}s cubic-bezier(.32,.72,.35,1)`;
      el.style.transform = 'translate(0, 0)';
    }));
    setTimeout(() => {
      el.style.transition = '';
      el.style.transform = '';
      el.classList.remove('flipping');
    }, FLIP_MS + 40);
  });
}

function toggleCheck(type, id){
  const prev = flipSnapshot();
  const k = tkey();
  store.mutate(S => {
    if(type === 'habit'){
      const arr = S.logs[k] || (S.logs[k] = []);
      const i = arr.indexOf(id);
      if(i < 0) arr.push(id); else arr.splice(i,1);
      if(!arr.length) delete S.logs[k];
    }else{
      const it = (S.extras[k] || []).find(x => x.id === id);
      if(it) it.done = !it.done;
    }
  });

  ui.keepScroll = true;
  render();
  flipPlay(prev);
}

/* ---------- 计数型：点一下 +1，长按给「减一 / 今天就这样」 ----------
   注意 logs 的语义没变：还是「这一天达标了」。只有 counts 到量才写进去，
   所以年度表 / 月度点阵 / 回顾那套统计口径一个字都不用改。 */
function bumpCount(id, delta){
  const prev = flipSnapshot();
  const k = tkey();
  store.mutate(S => {
    const h = S.habits.find(x => x.id === id);
    if(!h || !h.target) return;
    const day = S.counts[k] || (S.counts[k] = {});
    const next = Math.max(0, (day[id] || 0) + delta);
    if(next) day[id] = next; else delete day[id];
    if(!Object.keys(day).length) delete S.counts[k];

    const log = S.logs[k] || (S.logs[k] = []);
    const i = log.indexOf(id);
    if(next >= h.target.times){ if(i < 0) log.push(id); }   // 到量 → 达标
    else if(i >= 0) log.splice(i, 1);
    if(!log.length) delete S.logs[k];                       // 别在存档里留空数组
  });
  ui.keepScroll = true;
  render();
  flipPlay(prev);
}

function chkTap(type, id){
  const h = type === 'habit' ? store.read().habits.find(x => x.id === id) : null;
  if(!h || !h.target) return toggleCheck(type, id);
  const k = tkey();
  const cur = (store.read().counts[k] || {})[id] || 0;
  if(cur >= h.target.times){ toast('今天到量了'); return; }   // 到量锁定，再点没反应
  bumpCount(id, 1);
}

const CHK_HOLD = 460;
let chkTimer = null, chkFrom = null, chkGuardUntil = 0;

function openChkMenu(id, el){

}
function closeChkMenu(){
