/* target 改了（8 杯改成 5 杯）→ 每一天的「达标」要跟着重算。
   counts 一个都不删，所以改回 8 杯还能原样复原。 */
function syncTargetLogs(S, id){
  const h = S.habits.find(x => x.id === id);
  if(!h || !h.target) return;
  Object.keys(S.counts).forEach(k => {
    const n = (S.counts[k] || {})[id] || 0;
    const log = S.logs[k] || (S.logs[k] = []);
    const i = log.indexOf(id);
    if(n >= h.target.times){ if(i < 0) log.push(id); }
    else if(i >= 0) log.splice(i, 1);
    if(!log.length) delete S.logs[k];
  });
}

/* 拖动 = 改这个事项的安排；只写「今天对应的那个星期槽」 */
function assignTo(type, id, anchorId){
  const w = wd(), k = tkey();
  store.mutate(S => {
    if(type === 'habit'){
      const h = S.habits.find(x => x.id === id);
      if(!h) return;
      h.placement[w] = anchorId;      // null = 要做但没安排 → 进未分配
    }else{
      const it = (S.extras[k] || []).find(x => x.id === id);
      if(it) it.anchorId = anchorId;
    }
  });
}

function saveNote(k, v){
  store.mutate(S => {
    if(v.trim()) S.notes[k] = v; else delete S.notes[k];
  });
}

function saveAdd(){
  const f = ui.form;
  const title = f.title.trim();
  if(!title){ toast('先写点什么吧'); return; }
  const k = tkey();

  /* 时间先认一遍：直接从「时 / 分」四个框读，认不出来就别存 */
  let st = '', en = '';
  if(f.isAnchor){
    st = readTimeGroup('start'); en = readTimeGroup('end');
    if(st === null || en === null){ toast('小时 0–23，分钟 0–59'); return; }
  }

  store.mutate(S => {
    if(f.isAnchor){
      const days = f.aDays.length ? f.aDays.slice() : ALL.slice();
      const rule = { days, start: st || null, end: en || null };
      if(f.editId){
        const a = S.anchors.find(x => x.id === f.editId);
        if(a){ a.title = title; a.rules = [rule]; }
      }else{
        const maxOrder = S.anchors.reduce((m,a) => Math.max(m, a.order||0), 0);
        S.anchors.push({ id:uid('a_'), title, order:maxOrder+1, deleted:false, rules:[rule] });
      }
      return;
    }

    const icon = f.icon || 'default';

    if(f.resident){
      /* 常驻：按周循环。哪天做 = placement 的 key 存在；挂在哪个锚点 = 值。
         按次数记的不挂锚点（它整天都在进行，落在哪个锚点后面都说不通）。 */
      const placement = {};
      const at = f.target ? null : (f.anchorId || null);
      f.days.forEach(d => { placement[d] = at; });

      if(f.type === 'habit' && f.editId){
        const h = S.habits.find(x => x.id === f.editId);
        if(h){ h.title = title; h.mini = f.mini.trim(); h.icon = icon;
               h.placement = placement; h.target = (f.resident ? f.target : null) || null;
               syncTargetLogs(S, h.id); }
      }else{
        if(f.type === 'extra' && f.editId){
          /* 一次性 → 常驻：把它从今天的一次性里摘出来，转成长期 */
          const list = S.extras[k] || [];
          const i = list.findIndex(x => x.id === f.editId);
          if(i >= 0) list.splice(i,1);
          if(!list.length) delete S.extras[k];
        }
        const maxOrder = S.habits.reduce((m,h) => Math.max(m, h.order||0), 0);
        S.habits.push({ id:uid('h_'), title, mini:f.mini.trim(), icon,
                        order:maxOrder+1, archived:false, placement,
                        target: f.target || null });
      }
      return;
    }

    /* 一次性：只属于创建那天，第二天自动不在 */
    const list = S.extras[k] || (S.extras[k] = []);
    if(f.type === 'extra' && f.editId){
      const it = list.find(x => x.id === f.editId);
      if(it){ it.title = title; it.mini = f.mini.trim(); it.anchorId = f.anchorId || null; it.icon = icon; }
    }else{
      if(f.type === 'habit' && f.editId){
        /* 常驻 → 只有今天：从长期里摘掉（保留历史可读），落成今天的一次性 */
        const h = S.habits.find(x => x.id === f.editId);
        if(h) h.archived = true;
      }
      list.push({ id:uid('e_'), title, mini:f.mini.trim(), anchorId:f.anchorId || null, icon, done:false });
    }
  });

  /* 从哪来就回哪：汉堡页新增/编辑/删除后留在汉堡页，别把她甩到「今天」去 */
  ui.screen = ui.from || 'today';
  render();
}

/* 汉堡页左滑直接删：和编辑页里的删除是同一套（事项 / 锚点都软删，历史还读得到） */
function quickDelete(kind, id){
  if(!id) return;
  store.mutate(S => {
    if(kind === 'habit'){
      const h = S.habits.find(x => x.id === id);
      if(h) h.archived = true;
    }else if(kind === 'anchor'){
      const a = S.anchors.find(x => x.id === id);
      if(a) a.deleted = true;
    }
  });
  /* 删掉锚点后，挂在它下面的事项自动浮回「未分配」，不用额外处理 */
  swOpen = null;
  render();
  toast(kind === 'anchor' ? '锚点删掉了' : '删掉了');
}

function deleteItem(){
  const f = ui.form;
  if(!f.editId) return;
  const k = tkey();
  store.mutate(S => {
    if(f.type === 'habit'){
      const h = S.habits.find(x => x.id === f.editId);
      if(h) h.archived = true;                              // 软删，历史还读得到
    }else if(f.type === 'extra'){
      const list = S.extras[k] || [];
      const i = list.findIndex(x => x.id === f.editId);
      if(i >= 0) list.splice(i,1);
      if(!list.length) delete S.extras[k];
    }else if(f.type === 'anchor'){
      const a = S.anchors.find(x => x.id === f.editId);
      if(a) a.deleted = true;                               // 软删
    }
  });
  /* 删掉锚点后，挂在它下面的事项不需要任何处理 —— 它们自动浮回「未分配」 */
  /* 从哪来就回哪：汉堡页新增/编辑/删除后留在汉堡页，别把她甩到「今天」去 */
  ui.screen = ui.from || 'today';
  render();
}

/* ============================================================================
 * 拖动
 * ========================================================================*/
function nearestSlot(x, y){
  let best = null, bd = 1e9;
  document.querySelectorAll('[data-slot]').forEach(el => {
    const r = el.getBoundingClientRect();
    const cx = Math.max(r.left, Math.min(x, r.right));
    const cy = Math.max(r.top,  Math.min(y, r.bottom));
    const d = Math.hypot(x-cx, y-cy);
    if(d < bd){ bd = d; best = el; }
  });
  return best;   // 拖动时所有槽都在，最近的直接采纳
}

function slotAt(x, y){
  const el = document.elementFromPoint(x, y);
  const s = el && el.closest ? el.closest('[data-slot]') : null;
  if(s) return s;
  const s2 = el && el.closest ? el.closest('.unassigned') : null;
  if(s2){ const t = s2.querySelector('[data-slot]'); if(t) return t; }
  return nearestSlot(x, y);
}

/* 拖动要先"按住一下"才拿得起来：滑动页面和拖动不能再抢同一个手势。
   没拿起来之前，手指在卡片上滑动照常滚页面（.task 的 touch-action 是 pan-y）；
   这段缓冲里只要挪了 DRAG_SLOP，就判定"她是在滚页面"，这次拖动直接放掉。 */
const DRAG_HOLD = 280;   /* ms：按住这么久，卡片才算被"拿起来" */
const DRAG_SLOP = 8;     /* px：还没拿起来之前挪超过这么多 = 她要滚页面 */

function armDrag(d){
  if(!d || ui.drag !== d || d.armed) return;
  d.armed = true;
  if(d.card && d.card.classList) d.card.classList.add('arming');
}
function dropDrag(){
  const d = ui.drag;
  if(!d) return;
  ui.drag = null;
  clearTimeout(d.timer);
  if(d.card && d.card.classList) d.card.classList.remove('arming');
}

/* ---------- 返回：一个动作，两个入口 ----------
   左上角箭头（热区已放大）+ 新增/编辑页的「从左边缘往右滑」。 */
function goBack(){
  /* 从哪进来就回哪去：汉堡页点锚点/事项、设置页点锚点，都各自回自己那屏 */
  if(ui.screen === 'add' && ui.from) ui.screen = ui.from;
  else ui.screen = ui.tab || 'today';
  render();
}

/* iOS 习惯：手指从屏幕左边往右划 = 返回。
   只在「新增 / 编辑」这一屏生效；横向位移要明显大于纵向，否则当上下滚动处理。 */
const SWIPE_EDGE = 44;        // 从左边 44px 以内起手才算
const SWIPE_DIST = 64;        // 往右划过 64px 触发
let edgeSwipe = null;

document.addEventListener('pointerdown', e => {
  edgeSwipe = null;
  if(ui.screen !== 'add') return;
  if(e.pointerType === 'mouse') return;                        // 桌面点箭头就行
  if(e.clientX > SWIPE_EDGE) return;
  /* 从输入框 / 日期圆点 / 图标行上起手不算，免得跟打字和横滑打架 */
  if(e.target.closest('input,textarea,.dots,.picker,.chips,.switch,.time-row,.preview')) return;
  edgeSwipe = { x0: e.clientX, y0: e.clientY };
});

document.addEventListener('pointermove', e => {
  const s = edgeSwipe;
  if(!s) return;
  const dx = e.clientX - s.x0, dy = e.clientY - s.y0;
  if(dx < SWIPE_DIST) return;
  if(Math.abs(dy) > dx * 0.7){ edgeSwipe = null; return; }      // 更像上下滑 → 不认
  edgeSwipe = null;
  goBack();
});

document.addEventListener('pointerup', () => { edgeSwipe = null; });
document.addEventListener('pointercancel', () => { edgeSwipe = null; });

/* ---------- 汉堡页：往左滑露出「删除」 ----------
   跟她要的一样，像苹果备忘录：滑出来 → 点删除 → 直接没了，不用点进去。
   同一时间只允许一行开着；上下滑、点别处都会收回去。 */
const SW_DEL_W    = 82;   // 删除按钮宽度，和 CSS 里 .swipe-del 的 width 保持一致
const SW_OPEN_AT  = 32;   // 往左拖过这么远就停在「打开」态（不到就弹回去）
const SW_GUARD    = 320;  // 拖完这一小段时间内不认点击，否则手指一松就跟着跳进编辑页
let swDrag = null, swOpen = null, swGuardUntil = 0;

const swRow = w => w ? w.querySelector('.bgr-row') : null;

function swClose(wrap){
  if(!wrap) return;
  wrap.classList.remove('open');
  const r = swRow(wrap);
  if(r) r.style.transform = '';
  if(swOpen === wrap) swOpen = null;
}
function swCloseAll(){ document.querySelectorAll('.swipe.open').forEach(swClose); swOpen = null; }

document.addEventListener('pointerdown', e => {
  if(ui.screen !== 'burger') return;
  if(e.button !== undefined && e.button !== 0) return;
  const wrap = e.target.closest('.swipe');
  if(!wrap){ swCloseAll(); return; }                          // 点在面板外 → 收起
  if(e.target.closest('.swipe-del')) return;                  // 删除按钮自己走 click
  if(swOpen && swOpen !== wrap) swClose(swOpen);              // 摸另一行 → 先收起原来那行
  swDrag = { wrap, id:e.pointerId, x0:e.clientX, y0:e.clientY,
             base: wrap.classList.contains('open') ? -SW_DEL_W : 0, on:false };
});

document.addEventListener('pointermove', e => {
  const d = swDrag;
  if(!d || e.pointerId !== d.id) return;
  const dx = e.clientX - d.x0, dy = e.clientY - d.y0;

  if(!d.on){
    if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;        // 还在抖，方向没定
    if(Math.abs(dy) >= Math.abs(dx)){ swDrag = null; return; } // 上下居多 → 她要滚页面，放手
    d.on = true;
    const r = swRow(d.wrap);
    if(r) r.style.transition = 'none';                        // 拖的时候要跟手，不能有缓动
    document.querySelectorAll('.swipe.open').forEach(el => { if(el !== d.wrap) swClose(el); });
  }

  let x = d.base + dx;
  if(x > 0) x *= .2;                                          // 往右拉给阻尼，别硬顶
  if(x < -SW_DEL_W) x = -SW_DEL_W - ((-x - SW_DEL_W) * .25);   // 越过删除按钮也减速
  const r = swRow(d.wrap);
  if(r) r.style.transform = `translateX(${x}px)`;
});

function swFinish(commit, e){
  const d = swDrag; swDrag = null;
  if(!d || !d.on) return;
  const r = swRow(d.wrap);
  if(r){ r.style.transition = ''; r.style.transform = ''; }
  /* 松手时按位置决定停在打开还是弹回去 */
  const pos = commit && e ? d.base + (e.clientX - d.x0) : d.base;
  const open = pos <= -SW_OPEN_AT;
  d.wrap.classList.toggle('open', open);
  swOpen = open ? d.wrap : null;
  swGuardUntil = Date.now() + SW_GUARD;
}
document.addEventListener('pointerup', e => swFinish(true, e));
/* 浏览器把这块手势判成滚动了 → 恢复成拖动前的样子 */
document.addEventListener('pointercancel', () => swFinish(false));


/* ---------- 计数圈：长按 = 减一 / 今天就这样 ----------
   点一下是 +1（走 click），长按弹菜单。两件事必须分开：
   长按抬手后浏览器还会补一个 click，所以弹完菜单要挡一小段时间，否则一弹出就被关掉。 */
document.addEventListener('pointerdown', e => {
  if(ui.screen !== 'today') return;
  const el = e.target.closest('.chk, .hit');
  if(!el) return;
  const card = el.closest('.task');
  if(!card) return;
  const h = store.read().habits.find(x => x.id === card.dataset.id);
  if(!h || !h.target) return;                 // 普通事项没有菜单

  clearTimeout(chkTimer);
  chkFrom = { x: e.clientX, y: e.clientY, el };
  chkTimer = setTimeout(() => {
    chkTimer = null;
    chkGuardUntil = Date.now() + 420;
    openChkMenu(card.dataset.id, chkFrom.el);
  }, CHK_HOLD);
});
document.addEventListener('pointermove', e => {
  if(!chkTimer || !chkFrom) return;
  if(Math.hypot(e.clientX - chkFrom.x, e.clientY - chkFrom.y) > 9) dropChkHold();
});
function dropChkHold(){ clearTimeout(chkTimer); chkTimer = null; chkFrom = null; }
document.addEventListener('pointerup', dropChkHold);
document.addEventListener('pointercancel', dropChkHold);

document.addEventListener('pointerdown', e => {
  if(e.button !== undefined && e.button !== 0) return;
  const card = e.target.closest('.task');
  if(!card || e.target.closest('.chk, .hit')) return;  if(ui.screen !== 'today') return;
  /* 按住卡片就当"可能要在拖"：先掐掉浏览器默认行为，顺手清掉已有选区。
     不掐的话鼠标是选中文字、iOS 长按是弹拷贝菜单，两者都会打断拖动。
     这里只拦卡片（.chk 上面已经 return 了），输入框根本不经过这段。 */
  e.preventDefault();
  const sel = window.getSelection();
  if(sel && sel.removeAllRanges) sel.removeAllRanges();
  const r = card.getBoundingClientRect();
  /* 习惯栏的卡片没有"挂载点"可拖 —— 按住也不拿起来，抬手就是打开编辑 */
  const fixed = !!card.closest('.habitsec');
  ui.drag = {
    card, id: card.dataset.id, type: card.dataset.type,
    x0: e.clientX, y0: e.clientY,
    ox: e.clientX - r.left, oy: e.clientY - r.top,
    w: r.width, h: r.height,
    active: false, armed: false, target: null, moved: false,
    pointerId: e.pointerId, timer: null
  };
  if(fixed) return;
  /* 鼠标没有"滑动误触"这回事，按住就拖；触摸/笔要按住一下才拿起来。 */
  if(e.pointerType === 'mouse'){ armDrag(ui.drag); }
  else{ ui.drag.timer = setTimeout(() => armDrag(ui.drag), DRAG_HOLD); }
});

/* 卡片拿起来之后页面就不许再滚了 —— touch-action 是 pan-y，得手动挡。
   必须在第一个 touchmove 上就挡：浏览器一旦开始滚，这个手势就收不回来了。 */
document.addEventListener('touchmove', e => {
  if(ui.drag && ui.drag.armed) e.preventDefault();
}, {passive:false});

document.addEventListener('pointermove', e => {
  const d = ui.drag;
  if(!d) return;
  const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
  const dist = Math.hypot(dx, dy);
  if(!d.active){
    if(!d.armed){
      if(dist > DRAG_SLOP) dropDrag();   /* 没拿起来就挪 = 她要滚页面，让给她 */
      return;
    }
    if(dist < 8) return;
    d.active = true; d.moved = true;
    clearTimeout(d.timer); d.timer = null;
    d.card.classList.remove('arming');
    const r = d.card.getBoundingClientRect();
    d.ox = d.x0 - r.left; d.oy = d.y0 - r.top;
    d.card.style.width = d.w + 'px';
    d.card.style.height = d.h + 'px';
    d.card.classList.add('dragging');
    $('app').classList.add('locked');
    /* 重渲染一次：卡片原位收起、所有落点槽浮出、副标题变成"原来挂在…" */
    render();
    const again = document.querySelector(`.task[data-id="${cssEsc(d.id)}"]`);
    if(again){
      d.card = again;
      again.classList.add('dragging');
      again.style.width = d.w + 'px';
      again.style.height = d.h + 'px';
    }
  }
  const el = d.card;
  el.style.left = (e.clientX - d.ox) + 'px';
  el.style.top  = (e.clientY - d.oy) + 'px';

  const slot = slotAt(e.clientX, e.clientY);
  if(slot !== d.target){
    document.querySelectorAll('[data-slot]').forEach(s => s.classList.remove('near'));
    if(slot) slot.classList.add('near');
    d.target = slot;
  }
  e.preventDefault();
}, {passive:false});

function cssEsc(s){ return String(s).replace(/["\\]/g, '\\$&'); }

document.addEventListener('pointerup', e => {
  const d = ui.drag;
  if(!d) return;
  clearTimeout(d.timer);
  ui.drag = null;
  if(d.card && d.card.classList) d.card.classList.remove('arming');
  if(!d.active){
    /* 手指没挪 = 点了一下卡片 → 打开编辑。
       按住久一点再抬手也算点开（否则她慢一点按就变成"点了没反应"）。
       真正拖动过的走下面那条，不会被这里截胡。 */
    openEdit(d.type, d.id);
    return;
  }
  const slot = d.target;
  $('app').classList.remove('locked');
  if(slot){
    const raw = slot.dataset.slot;
    assignTo(d.type, d.id, raw === 'none' ? null : raw);
  }
  render();   // 松手立即生效，不弹确认、不弹撤销
});

document.addEventListener('pointercancel', () => {
  const d = ui.drag;
  ui.drag = null;
  if(!d) return;
  clearTimeout(d.timer);
  if(d.card && d.card.classList) d.card.classList.remove('arming');
  if(d.active){
    $('app').classList.remove('locked');
    render();
  }
});

/* ============================================================================
 * 点击分派
 * ========================================================================*/
function openEdit(type, id, from){
  const S = store.read();
  const f = blankForm();
  if(type === 'habit'){
    const h = S.habits.find(x => x.id === id);
    if(!h) return;
    f.isAnchor = false; f.type = 'habit'; f.editId = h.id;
    f.title = h.title; f.mini = h.mini || ''; f.icon = h.icon || 'default';
    f.target = h.target || null;
    f.resident = true;
    f.days = Object.keys(h.placement).map(Number).sort((a,b)=>a-b);
    f.anchorId = h.placement[wd()] || '';
  }else if(type === 'extra'){
    const e0 = (S.extras[tkey()] || []).find(x => x.id === id);
    if(!e0) return;
    f.isAnchor = false; f.type = 'extra'; f.editId = e0.id;
    f.title = e0.title; f.mini = e0.mini || ''; f.icon = e0.icon || 'default';
    f.resident = false;
    f.anchorId = e0.anchorId || '';
  }
  ui.form = f;
  ui.from = from || 'today';
  ui.screen = 'add';
  render();
}

document.addEventListener('click', e => {
  /* 长按刚弹过菜单：这一下抬手补发的 click 不能当真（否则菜单一出现就被关上） */
  if(Date.now() < chkGuardUntil) return;
  /* 菜单开着时点别处就关。热区已经铺满整卡右侧，再排除 .chk / .hit
     就等于"点哪儿都不关"，菜单会一直挂着 —— 长按补发的那个 click 由上面的
     chkGuardUntil 挡，不靠这条来防。 */
  if(ui.chkMenu && !e.target.closest('.chkmenu')) closeChkMenu();

  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const S = store.read();

  if(act === 'open-howto'){ ui.howtoI = 0; ui.howtoFrom = ui.screen; ui.screen = 'howto'; render(); return; }
  if(act === 'howto-next'){
    if((ui.howtoI || 0) >= HOWTO_PAGES.length - 1) howtoClose();
    else howtoGo((ui.howtoI || 0) + 1);
    return;
  }
  if(act === 'howto-close'){ howtoClose(); return; }

  if(act === 'tab'){ ui.screen = el.dataset.tab; render(); return; }
  if(act === 'open-settings'){ ui.from = 'today'; ui.screen = 'settings'; render(); return; }
  if(act === 'back'){ goBack(); return; }
  if(act === 'open-note'){ ui.noteD = el.dataset.date || tkey(); ui.screen = 'note'; render(); return; }
  if(act === 'open-add'){
    ui.form = blankForm();
    ui.from = ui.screen === 'burger' ? 'burger' : 'today';
    ui.screen = 'add'; render(); return;
  }
  if(act === 'open-year'){ ui.screen = 'year'; render(); return; }
  if(act === 'open-add-anchor'){
    ui.form = blankForm(); ui.form.isAnchor = true;
    ui.from = ui.screen === 'burger' ? 'burger' : 'settings';
    ui.screen = 'add'; render(); return;
  }
  /* 汉堡页左滑露出的删除按钮：点了就删，不弹确认（她要的「不用点进去」） */
  if(act === 'quick-del'){
    swCloseAll();
    quickDelete(el.dataset.kind, el.dataset.id);
    return;
  }
  /* 刚滑完的那一下不要当成点击，否则一松手就跟着跳进编辑页 */
  if(act === 'edit-habit' || act === 'edit-anchor'){
    if(Date.now() < swGuardUntil) return;
    const wrap = el.closest('.swipe');
    if(wrap && wrap.classList.contains('open')){ swClose(wrap); return; }  // 开着时点这行 = 收起来
  }
  if(act === 'edit-habit'){ openEdit('habit', el.dataset.id, 'burger'); return; }
  if(act === 'edit-anchor'){
    const a = S.anchors.find(x => x.id === el.dataset.id);
    if(!a) return;
    const f = blankForm();
    f.isAnchor = true; f.type = 'anchor'; f.editId = a.id; f.title = a.title;
    f.aDays = (a.rules[0] ? a.rules[0].days.slice() : ALL.slice());
    f.start = (a.rules[0] && a.rules[0].start) || '';
    f.end   = (a.rules[0] && a.rules[0].end)   || '';
    ui.form = f;
    ui.from = ui.screen === 'burger' ? 'burger' : 'settings';
    ui.screen = 'add'; render(); return;
  }
  if(act === 'check'){ chkTap(el.dataset.type, el.dataset.id); return; }
  if(act === 'chk-minus'){
    const id = (ui.chkMenu || {}).id;
    closeChkMenu();
    if(id) bumpCount(id, -1);
    return;
  }
  if(act === 'chk-ok'){ closeChkMenu(); return; }
  if(act === 'pick-day'){ ui.reviewD = el.dataset.date; render(); return; }
  if(act === 'mprev'){
    ui.calM.m--; if(ui.calM.m < 0){ ui.calM.m = 11; ui.calM.y--; } render(); return;
  }
  if(act === 'mnext'){
    ui.calM.m++; if(ui.calM.m > 11){ ui.calM.m = 0; ui.calM.y++; } render(); return;
  }
  if(act === 'save-add'){ saveAdd(); return; }
  if(act === 'delete-item'){ deleteItem(); return; }
  if(act === 'reset-all'){
    store.reset();
    ui.form = blankForm();
    ui.screen = 'settings';
    render();
    toast('清空了');
    return;
  }
  if(act === 'export-backup'){ exportBackup(); return; }
  if(act === 'import-backup'){ const f = $('importFile'); if(f) f.click(); return; }
  if(act === 'close-ios-tip'){
    const t = $('iosTip');
    if(t) t.remove();
    /* 只用 sessionStorage —— 页面数据一律走 store，这里不碰 localStorage */
    try{ sessionStorage.setItem('hb_tip_seen', '1'); }catch(e){}
    return;
  }

  if(act === 'toggle-anchor'){
    ui.form.isAnchor = !ui.form.isAnchor;
    if(ui.form.isAnchor) ui.form.resident = false;
    render();
    const t = $('fTitle'); if(t){ t.focus(); }
    return;
  }
  if(act === 'toggle-resident'){
    ui.form.resident = !ui.form.resident;
    if(ui.form.resident && !ui.form.days.length) ui.form.days = ALL.slice();
    render();
    const t = $('fTitle'); if(t){ t.focus(); }
    return;
  }
  if(act === 'day'){
    const k = el.dataset.kind === 'a' ? 'aDays' : 'days';
    const d = Number(el.dataset.day);
    const arr = ui.form[k];
    const i = arr.indexOf(d);
    if(i < 0) arr.push(d); else arr.splice(i,1);
    arr.sort((x,y)=>x-y);
    render(); return;
  }
  if(act === 'pick-icon'){
    ui.form.icon = el.dataset.id;
    /* 只改选中态、不重渲染 —— 重渲染会把正在输入的框清掉 */
    const row = el.closest('.picker');
    row.querySelectorAll('.pick').forEach(p => p.classList.toggle('on', p === el));
    scrollPickIntoView(row, el, true);
    return;
  }
  if(act === 'pick-anchor'){ ui.form.anchorId = el.dataset.id; render(); return; }
});

document.addEventListener('input', e => {
  const el = e.target, id = el.id, v = el.value;

  /* 时间：小时框 / 分钟框，只收数字，合成 "H:mm" 写回表单 */
  if(el.dataset && el.dataset.t){
    const digits = v.replace(/\D/g, '').slice(0, 2);
    if(digits !== v) el.value = digits;
    ui.form[el.dataset.t] = readTimeGroup(el.dataset.t);
    updatePreview();
    /* 小时打满两位就跳到分钟框 —— 少按一次，也让"这格是小时"更确定 */
    if(el.dataset.p === 'h' && el.value.length === 2){
      const mEl = $(el.dataset.t === 'start' ? 'fStartM' : 'fEndM');
      if(mEl) mEl.focus();
    }
    return;
  }

  if(id === 'fTitle') ui.form.title = v;
  else if(id === 'fMini') ui.form.mini = v;
  else if(id === 'fTarget'){
    const hint = $('fTargetHint');
    if(hint) hint.style.display = 'none';       // 又开始打字了，先把提示收起来
  }
  else if(id === 'noteInput'){
    const k = ui.noteD || tkey();
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => saveNote(k, v), 900);
  }
  if(id === 'fTitle' || id === 'fMini') updatePreview();
});

/* 把「时 / 分」两个框读成一个时间字符串。两个都空 = 没填（''）；
   填了但超范围 = null，交回调用方提示，绝不把坏值写进数据。 */
function readTimeGroup(which){
  const pre = which === 'start' ? 'fStart' : 'fEnd';
  const hEl = $(pre + 'H'), mEl = $(pre + 'M');
  if(!hEl || !mEl) return '';
  const hv = hEl.value.trim(), mv = mEl.value.trim();
  if(!hv && !mv) return '';
  const t = normTime((hv || '0') + ':' + (mv || '0'));
  if(t === null) return null;                       // 超范围，让调用方去描红
  return which === 'end' ? noEnd(t) : t;            // 结束是 0:00 = 没填
}

/* 收键盘时补齐两位（8 → 08），超范围描红 */
function tidyGroup(which){
  const pre = which === 'start' ? 'fStart' : 'fEnd';
  const hEl = $(pre + 'H'), mEl = $(pre + 'M');
  if(!hEl || !mEl) return;
  const hv = hEl.value.trim(), mv = mEl.value.trim();
  if(!hv && !mv){
    hEl.classList.remove('bad'); mEl.classList.remove('bad');
    ui.form[which] = ''; updatePreview(); return;
  }
  const H = hv === '' ? 0 : +hv, M = mv === '' ? 0 : +mv;
  const ok = H >= 0 && H <= 23 && M >= 0 && M <= 59;
  hEl.classList.toggle('bad', !ok);
  mEl.classList.toggle('bad', !ok);
  if(!ok){ toast('小时 0–23，分钟 0–59'); return; }
  const t = H + ':' + String(M).padStart(2, '0');
  /* 结束时间填成 0 点：她要的是"删掉这组"，所以两个框一起清空。
     不然框里留着 00:00、实际却按"没填"存，显示和数据就对不上了。 */
  if(which === 'end' && !noEnd(t)){
    hEl.value = ''; mEl.value = '';
    ui.form[which] = ''; updatePreview(); return;
  }
  hEl.value = String(H).padStart(2, '0');
  mEl.value = String(M).padStart(2, '0');
  ui.form[which] = t;
  updatePreview();
}

let noteTimer = null;
document.addEventListener('focusout', e => {
  const id = e.target.id;
  if(e.target.dataset && e.target.dataset.t){
    tidyGroup(e.target.dataset.t);
    return;
  }
  if(id === 'noteInput'){
    clearTimeout(noteTimer);
    saveNote(ui.noteD || tkey(), e.target.value);
  }
  /* 「一天要做几次」只在失焦时认一次，然后把框重写成规范形式「8 杯」。
     认不出来不猜、不清空 —— 保留她写的原文，把那行说明临时换成"没认出来"。 */
  if(id === 'fTarget'){
    const raw = e.target.value;
    const t = parseTarget(raw);
    const hint = $('fTargetHint');
    const HINT_OK = '留空 = 只做一次。填了会进「习惯」栏，点一下加一次。';
    ui.form.target = t;
    if(t){
      e.target.value = targetInput(t);
      if(hint){ hint.classList.remove('bad'); hint.textContent = HINT_OK; }
      if(!ui.form.resident){
        /* 一次性事项是布尔，计数没有意义 —— 填了次数就自动常驻，别让她填了个寂寞 */
        ui.form.resident = true;
        render();
        toast('按次数记的，会常驻');
        return;
      }
    }else if(hint){
      const bad = !!raw.trim();
      hint.classList.toggle('bad', bad);
      hint.textContent = bad ? '没认出来。写成「8 杯」「3 次」这样就行。' : HINT_OK;
    }
    updatePreview();
  }
});

/* 选了备份文件 */
document.addEventListener('change', e => {
  if(e.target.id !== 'importFile') return;
  const f = e.target.files && e.target.files[0];
  if(f) importBackup(f);
  e.target.value = '';          // 同一个文件还能再选一次
});

/* 预览跟着填的东西变（局部更新，不重渲染 → 输入不会丢焦点） */
function updatePreview(){
  const p = document.querySelector('.preview');
  if(p) p.textContent = previewText();
}

/* ============================================================================
 * 启动
 * ========================================================================*/
/* 第一次打开先把说明书摆出来 —— 关掉才进今天页 */
if(!store.read().seenHowto) ui.screen = 'howto';
render();

/* 跨天自动翻页（放着不动到第二天，今天页要跟着走） */
setInterval(() => {
  const now = new Date();
  if(dkey(now) !== dkey(ui.today) && ui.screen !== 'add' && ui.screen !== 'note'){
    ui.today = now;
    ui.reviewD = dkey(now);
    render();
  }
}, 60000);

/* ============================================================================
 * iOS：第一次多半是在 Safari（或者更糟，在微信里）打开的
 *   加到主屏幕之后 display-mode 就变成 standalone，这条提示自己消失。
 * ========================================================================*/
function iosHint(){
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const standalone = navigator.standalone === true ||
                     window.matchMedia('(display-mode: standalone)').matches;
  if(!isIOS || standalone) return;
  try{ if(sessionStorage.getItem('hb_tip_seen') === '1') return; }catch(e){}

  /* 微信内置浏览器没有「添加到主屏幕」这个菜单，得先请她去浏览器 */
  const inWX = /MicroMessenger/i.test(ua);
  const txt = inWX
    ? `点右上角的 <b>⋯</b> 选<b>在浏览器打开</b>，<br>再从浏览器的分享菜单<b>添加到主屏幕</b>。`
    : `点屏幕底部的<b>分享</b>按钮，<br>往下找<b>「添加到主屏幕」</b>，桌面就有图标了。`;

  const el = document.createElement('div');
  el.className = 'ios-tip';
  el.id = 'iosTip';
  el.innerHTML =
    `<div class="ios-tip-txt">${txt}</div>
     <span class="ios-tip-x" data-act="close-ios-tip" aria-label="知道了">
       <svg width="11" height="11" viewBox="0 0 11 11"><path d="M1.6 1.6l7.8 7.8M9.4 1.6l-7.8 7.8" stroke="#C8B5A1" stroke-width="1.7" stroke-linecap="round"/></svg>
     </span>`;
  document.body.appendChild(el);
}

/* 请求持久化存储：iOS 在空间紧张时会驱逐"尽力而为"的数据，
   装到主屏幕的 App 更容易拿到豁免。被拒也不影响使用。 */
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(() => {});
}


/* 让某个图标在横滑行里露出来。用 getBoundingClientRect 而不是 offsetLeft ——
   .form 是 position:relative，offsetLeft 是相对它算的，不是相对这条滚动条。 */
function scrollPickIntoView(row, el, smooth){
  const rr = row.getBoundingClientRect(), er = el.getBoundingClientRect();
  if(er.left >= rr.left && er.right <= rr.right) return;
  const left = Math.max(0, row.scrollLeft + (er.left - rr.left)
                           - (row.clientWidth - er.width) / 2);
  if(smooth) row.scrollTo({left, behavior:'smooth'});
  else row.scrollLeft = left;
}

/* 图标行：滑到底就把右边渐隐收掉；进来时把当前选中的那个滚到看得见的地方
   （编辑一条用了靠后图标的旧事项时，不然看不出它选的是哪个）。 */
function initPicker(){
  const p = document.querySelector('.picker');
  if(!p) return;
  const mark = () => p.classList.toggle(
    'at-end', p.scrollLeft + p.clientWidth >= p.scrollWidth - 2);
  p.addEventListener('scroll', mark, {passive:true});
  const sel = p.querySelector('.pick.on');
  if(sel) scrollPickIntoView(p, sel, false);
  mark();
}

/* PWA：service worker */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

iosHint();
